name: Staff POPs Firestore and Storage E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/staff/staffProcedure*.ts'
      - 'server/staff/staffNoticeService.ts'
      - 'shared/staffProcedures.ts'
      - 'api/health.ts'
      - 'vercel.json'
      - 'firebase.security.json'
      - 'tests/staff-pops*.mjs'
      - 'tests/staff-pops*.ts'
      - '.github/workflows/staff-pops-firestore-storage-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pop-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Validate POP roles, immutable versions, private file, notifications and acknowledgments
        env:
          FIREBASE_PROJECT_ID: kyrub-security-test
          GCLOUD_PROJECT: kyrub-security-test
          GOOGLE_CLOUD_PROJECT: kyrub-security-test
        run: npx --yes firebase-tools@15.35.0 emulators:exec --config firebase.security.json --project kyrub-security-test --only firestore,storage "node --import tsx tests/staff-pops-serverless-http-e2e.mjs"

name: Kyrub executor — renewal 1064 (pilot)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit = report only; fix = bounded code edits and draft PR"
        required: true
        type: choice
        options: [audit, fix]
        default: audit

permissions:
  contents: read

concurrency:
  group: kyrub-executor-1064
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_BRANCH: feat/subscription-renewal-offer-contract
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout audited renewal branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout executor configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: executor-config
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare isolated work branch
        if: inputs.mode == 'fix'
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "agent/renewal-1064-${GITHUB_RUN_ID}"
      - name: Install executor and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --global @openai/codex@0.47.0
      - name: Execute bounded mission
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.KYRUB_EXECUTOR_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "Missing KYRUB_EXECUTOR_OPENAI_API_KEY"; exit 1; }
          mkdir -p executor-results
          if [ "$MODE" = "audit" ]; then
            codex exec --sandbox read-only --output-last-message executor-results/report.md - < executor-config/.github/kyrub-executor/mission-1064.md
          else
            codex exec --sandbox workspace-write --output-last-message executor-results/report.md - < executor-config/.github/kyrub-executor/mission-1064.md
          fi
      - name: Check allowed changes
        if: inputs.mode == 'fix' && success()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          python3 executor-config/.github/kyrub-executor/check-scope.py
      - name: Run focused verification
        if: inputs.mode == 'fix'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p executor-results
          npm run lint > executor-results/lint.log 2>&1
          LINT_STATUS=$?
          node --test --test-concurrency=2 --import tsx tests/*prepaid-renewal*.test.ts > executor-results/tests.log 2>&1
          TEST_STATUS=$?
          printf 'lint=%s\nrenewal_tests=%s\n' "$LINT_STATUS" "$TEST_STATUS" > executor-results/checks.txt
          if [ "$LINT_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ]; then exit 1; fi
      - name: Publish isolated changes
        if: inputs.mode == 'fix' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "kyrub-executor[bot]"
          git config user.email "kyrub-executor[bot]@users.noreply.github.com"
          git add -- server/payments server/integrations src/components src/utils tests api shared
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "fix: bounded prepaid renewal integration (executor pilot)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/agent/renewal-1064-${GITHUB_RUN_ID}"
          gh pr create --draft --base "$TARGET_BRANCH" --head "agent/renewal-1064-${GITHUB_RUN_ID}" --title "fix: executor pilot for prepaid renewals" --body "Automated bounded work against PR #1064. No merge or production changes. Review code and CI before adoption."
      - name: Upload executor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kyrub-executor-1064-${{ github.run_id }}
          path: executor-results/
          if-no-files-found: warn
          retention-days: 7

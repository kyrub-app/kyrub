name: Kyrub executor — renewal 1064 (read-only pilot)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyrub-executor-1064
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      TARGET_BRANCH: feat/subscription-renewal-offer-contract
    steps:
      - name: Checkout audited renewal branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout executor configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: executor-config
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install executor and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.166.0
          codex --version
      - name: Execute bounded mission
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.KYRUB_EXECUTOR_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "Missing KYRUB_EXECUTOR_OPENAI_API_KEY"; exit 1; }
          mkdir -p executor-results
          # Check API-key authentication before starting the expensive agent run.
          # Do not print the key, response body, or request headers.
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          req = urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("OpenAI API authentication check: HTTP", response.status)
          except urllib.error.HTTPError as exc:
              print("OpenAI API authentication check failed: HTTP", exc.code)
              raise SystemExit(1)
          except Exception as exc:
              print("OpenAI API authentication check failed:", type(exc).__name__)
              raise SystemExit(1)
          PY
          timeout --signal=TERM --kill-after=30s 35m env CODEX_API_KEY="$OPENAI_API_KEY" codex exec --sandbox read-only --output-last-message executor-results/report.md - < executor-config/.github/kyrub-executor/mission-1064.md
      - name: Upload executor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kyrub-executor-1064-${{ github.run_id }}
          path: executor-results/
          if-no-files-found: warn
          retention-days: 7

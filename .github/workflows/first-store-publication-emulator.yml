name: First store publication emulator
on:
  pull_request:
    paths:
      - 'api/action-execute.ts'
      - 'server/gamification/firstStorePublicationHandler.ts'
      - 'server/gamification/firstStorePublicationAuthority.ts'
      - 'server/gamification/firstStorePublished*.ts'
      - 'tests/first-store-publication*.test.ts'
      - '.github/workflows/first-store-publication-emulator.yml'
  workflow_dispatch:
jobs:
  first-store-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run publication contract and transaction tests
        run: node --test --import tsx tests/first-store-publication-authority-contract.test.ts tests/first-store-publication-authority.test.ts tests/first-store-publication-provisioning.test.ts tests/first-store-published-reward.test.ts tests/first-store-published-transaction.test.ts
      - name: Run isolated Firestore Emulator test
        run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only firestore "node --test --test-concurrency=1 --import tsx tests/first-store-publication-emulator.test.ts"

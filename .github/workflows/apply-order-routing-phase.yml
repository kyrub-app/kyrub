name: Apply order routing phase

on:
  push:
    branches:
      - agent/order-approval-origin-delivery-queue
    paths:
      - .github/workflows/apply-order-routing-phase.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/order-approval-origin-delivery-queue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patches
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          retailer = Path('src/components/RetailerPanel.tsx')
          source = retailer.read_text()

          replacements = [
            (
              "import { CustomerOrderInbox } from './customer/CustomerOrderInbox';\n",
              "import { CustomerOrderInbox } from './customer/CustomerOrderInbox';\nimport { AttendanceOrderApproval } from './customer/AttendanceOrderApproval';\n",
            ),
            (
              "  subscribeToStoreCustomerOrders,\n  updateCustomerOrderStatus,\n  type CustomerOrder,\n",
              "  subscribeToStoreCustomerOrders,\n  type CustomerOrder,\n",
            ),
            (
              "import { buildCustomerTableCards } from '../utils/customerTables';\n",
              "import { buildCustomerTableCards } from '../utils/customerTables';\nimport {\n  isOrderVisibleInKds,\n  updateOrderStatusWithDecision,\n  type OrderDecision,\n} from '../utils/orderWorkflow';\n",
            ),
            (
              "    triggerToast,\n    activeSubTab,\n  } = props;",
              "    triggerToast,\n    activeSubTab,\n    atendimentoSpaces,\n  } = props;",
            ),
            (
              "  const tableCards = useMemo(\n    () => buildCustomerTableCards(customerOrders),\n    [customerOrders]\n  );\n",
              "  const tableCards = useMemo(\n    () => buildCustomerTableCards(customerOrders),\n    [customerOrders]\n  );\n  const kdsOrders = useMemo(\n    () => customerOrders.filter(isOrderVisibleInKds),\n    [customerOrders]\n  );\n",
            ),
            (
              "  const handleChangeOrderStatus = async (\n    order: CustomerOrder,\n    status: CustomerOrderStatus\n  ): Promise<void> => {",
              "  const handleChangeOrderStatus = async (\n    order: CustomerOrder,\n    status: CustomerOrderStatus,\n    decision?: OrderDecision\n  ): Promise<void> => {",
            ),
            (
              "      await updateCustomerOrderStatus(activeRetailerId, order.id, status);",
              "      await updateOrderStatusWithDecision(\n        activeRetailerId,\n        order.id,\n        status,\n        decision\n      );",
            ),
            (
              "          <CustomerOrderInbox\n            orders={customerOrders}\n            busyOrderId={busyOrderId}\n            onChangeStatus={handleChangeOrderStatus}\n          />",
              "          <CustomerOrderInbox\n            orders={kdsOrders}\n            busyOrderId={busyOrderId}\n            attendanceSpaces={atendimentoSpaces}\n            onChangeStatus={handleChangeOrderStatus}\n          />",
            ),
            (
              "      {selectedTableCode && (\n        <TableServiceWorkspace\n          storeId={activeRetailerId}\n          tableCode={selectedTableCode}\n          products={products}\n          orders={customerOrders}\n          onClose={() => setSelectedTableCode('')}\n          notify={triggerToast}\n        />\n      )}",
              "      {selectedTableCode && (\n        <>\n          <TableServiceWorkspace\n            storeId={activeRetailerId}\n            tableCode={selectedTableCode}\n            products={products}\n            orders={customerOrders}\n            onClose={() => setSelectedTableCode('')}\n            notify={triggerToast}\n          />\n          <AttendanceOrderApproval\n            storeId={activeRetailerId}\n            tableCode={selectedTableCode}\n            orders={customerOrders}\n            notify={triggerToast}\n          />\n        </>\n      )}",
            ),
          ]

          for old, new in replacements:
            if old not in source:
              raise SystemExit(f'RetailerPanel replacement not found: {old[:80]!r}')
            source = source.replace(old, new, 1)
          retailer.write_text(source)

          protocol = Path('server/integrations/openDelivery.ts')
          protocol_source = protocol.read_text()
          old = "      grant_type: 'client_credentials',\n"
          new = "      grant_type: 'client_credentials',\n      scope: 'od.all',\n"
          if old not in protocol_source:
            raise SystemExit('Open Delivery OAuth block not found')
          protocol.write_text(protocol_source.replace(old, new, 1))

          package = Path('package.json')
          package_data = json.loads(package.read_text())
          prebuild = package_data['scripts']['prebuild']
          marker = 'tests/99food-integration-contract.test.ts'
          additions = (
            'tests/order-approval-routing.test.ts '
            'tests/99food-ingress-queue.test.ts '
            'tests/delivery-opportunity-routing.test.ts'
          )
          if additions not in prebuild:
            prebuild = prebuild.replace(marker, f'{marker} {additions}')
          package_data['scripts']['prebuild'] = prebuild
          package.write_text(json.dumps(package_data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RetailerPanel.tsx server/integrations/openDelivery.ts package.json
          git commit -m "Wire approval gate, KDS origins and Open Delivery scope"
          git push origin HEAD:agent/order-approval-origin-delivery-queue

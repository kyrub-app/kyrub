name: Finalize order routing phase

on:
  push:
    branches:
      - agent/order-approval-origin-delivery-queue
    paths:
      - .github/workflows/apply-order-routing-phase.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/order-approval-origin-delivery-queue
      - name: Preserve reconciliation response and remove temporary workflow
        run: |
          python <<'PY'
          from pathlib import Path

          router = Path('server/integrations/ninetyNineFoodRouter.ts')
          source = router.read_text()
          old = """      const ingress = await drainNinetyNineFoodIngressQueue(100);
      const polling = await pollNinetyNineFood(tenantId);
      response.json({ ingress, polling });
"""
          new = """      const ingress = await drainNinetyNineFoodIngressQueue(100);
      const polling = await pollNinetyNineFood(tenantId);
      response.json({ ...polling, ingress });
"""
          if old not in source:
            raise SystemExit('Tenant poll response block not found')
          router.write_text(source.replace(old, new, 1))
          PY
          git rm .github/workflows/apply-order-routing-phase.yml
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/integrations/ninetyNineFoodRouter.ts .github/workflows/apply-order-routing-phase.yml
          git commit -m "Preserve reconciliation contract and remove patch workflow"
          git push origin HEAD:agent/order-approval-origin-delivery-queue

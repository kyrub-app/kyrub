name: V1 private directory API integration
on:
  pull_request:
    paths:
      - 'api/health.ts'
      - 'src/utils/privateDirectoryClientTransport.ts'
      - 'src/utils/socialDirectoryPilot.ts'
      - 'src/utils/adminDirectoryPilot.ts'
      - 'tests/v1-private-directory-api-integration.test.ts'
      - '.github/workflows/v1-private-directory-api-integration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test --import tsx tests/v1-private-directory-api-integration.test.ts tests/v1-private-directory-transport.test.ts
      - run: node scripts/check-vercel-function-budget.mjs

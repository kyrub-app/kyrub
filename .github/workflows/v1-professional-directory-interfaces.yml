name: V1 professional directory interfaces
on:
  pull_request:
    paths:
      - 'src/components/store/StoreTeamWorkspace.tsx'
      - 'src/utils/adminDirectory.ts'
      - 'src/utils/adminControlPlane.ts'
      - 'src/utils/*DirectoryPilot.ts'
      - 'tests/v1-professional-directory-interfaces.test.ts'
      - '.github/workflows/v1-professional-directory-interfaces.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test --import tsx tests/v1-professional-directory-interfaces.test.ts

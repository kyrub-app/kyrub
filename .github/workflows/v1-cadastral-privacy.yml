name: V1 isolated cadastral privacy
on:
  pull_request:
    paths:
      - 'server/identity/socialDiscoveryDirectoryService.ts'
      - 'server/identity/directoryQuotaService.ts'
      - 'server/identity/storeStaffDirectoryService.ts'
      - 'scripts/inventory-user-directory-access.mjs'
      - 'scripts/build-cadastral-privacy-candidate.ts'
      - 'src/utils/storeDirectory.ts'
      - 'docs/security/V1_CADASTRAL_CUTOVER_RUNBOOK.md'
      - 'tests/v1-cadastral-privacy-emulator.test.ts'
      - '.github/workflows/v1-cadastral-privacy.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: node scripts/inventory-user-directory-access.mjs > directory-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: cadastral-directory-inventory
          path: directory-inventory.json
          retention-days: 3
      - run: npm run firestore:compose
      - run: node --import tsx scripts/build-cadastral-privacy-candidate.ts
      - run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project demo-kyrub-privacy --only firestore "node --test --import tsx tests/v1-cadastral-privacy-emulator.test.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: cadastral-privacy-review-only
          path: .firebase/privacy-review-only/
          include-hidden-files: true
          retention-days: 3

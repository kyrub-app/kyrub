name: Validate Kyrub

on:
  push:
    branches: ['fix/diag-merchant-approval-build-v3']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-diagnostic:
    name: NPM lifecycle diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Initial MVP readiness
        run: npm run mvp:check

      - name: Initial TypeScript
        run: npm run lint

      - name: Initial contract tests
        run: >-
          node --test --import tsx
          tests/identity-verification.test.ts
          tests/passkey-security.test.ts
          tests/work-eligibility-enforcement.test.ts
          tests/kyrubia-cloud-history-contract.test.ts
          tests/kyrubia-list-products-category-semantics.test.ts
          tests/kyrubia-operational-read-manual-bypass.test.ts
          tests/kyrubia-product-publication-by-id.test.ts
          tests/gamification-redemption-repository.test.ts
          tests/app-error-boundary.test.ts
          tests/production-health.test.ts
          tests/local-attendance-serverless-routing.test.ts

      - name: Direct prebuild chain
        continue-on-error: true
        run: |
          npm run mvp:check
          npm run lint
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.join(' '))")
          node --test --test-concurrency=4 --import tsx $FILES

      - name: Exact npm prebuild lifecycle
        continue-on-error: true
        run: npm run prebuild

      - name: Npm build script without lifecycle hooks
        continue-on-error: true
        run: npm --ignore-scripts run build

      - name: Direct Vite bundle
        continue-on-error: true
        run: npx vite build

      - name: Direct server esbuild
        continue-on-error: true
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=/tmp/kyrub-server.cjs

      - name: Diagnostic complete
        run: echo "NPM lifecycle diagnostic completed"

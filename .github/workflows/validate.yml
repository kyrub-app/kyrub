name: Validate Kyrub

on:
  push:
    branches: ['fix/diag-merchant-approval-build-v2']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-package-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/diag-merchant-approval-build-v2

      - name: Bound prebuild test concurrency
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const before = pkg.scripts.prebuild;
          pkg.scripts.prebuild = before.replace(
            'node --test --import tsx ',
            'node --test --test-concurrency=4 --import tsx '
          );
          if (pkg.scripts.prebuild === before && !before.includes('--test-concurrency=4')) {
            throw new Error('Expected prebuild test command was not found.');
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Commit package change
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json already bounded"
            exit 0
          fi
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add package.json
          git commit -m "Bound prebuild test concurrency"
          git push origin HEAD:fix/diag-merchant-approval-build-v2

name: Validate Kyrub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Capture composed rules
        uses: actions/upload-artifact@v4
        with:
          name: composed-firestore-rules
          path: .firebase/firestore.combined.rules
          if-no-files-found: error
          retention-days: 3

      - name: MVP readiness
        run: npm run mvp:check

      - name: TypeScript
        run: npm run lint

      - name: Contract tests
        run: >-
          node --test --import tsx
          tests/identity-verification.test.ts
          tests/passkey-security.test.ts
          tests/work-eligibility-enforcement.test.ts
          tests/kyrubia-cloud-history-contract.test.ts
          tests/kyrubia-list-products-category-semantics.test.ts
          tests/kyrubia-operational-read-manual-bypass.test.ts
          tests/kyrubia-product-publication-by-id.test.ts
          tests/gamification-redemption-repository.test.ts
          tests/app-error-boundary.test.ts
          tests/production-health.test.ts
          tests/local-attendance-serverless-routing.test.ts

      - name: Diagnostic legacy checkout-before-order contract
        continue-on-error: true
        run: >-
          node --test --import tsx
          --test-name-pattern="delivery and pickup initiate payment without materializing an order in the browser"
          tests/marketplace-payment-intent-checkout.test.ts

      - name: Diagnostic legacy intent-before-order contract
        continue-on-error: true
        run: >-
          node --test --import tsx
          --test-name-pattern="delivery and pickup create a server-side pending PaymentIntent instead of an operational order"
          tests/customer-storefront-order-e2e-contract.test.ts

      - name: Diagnostic legacy paid-only materialization contract
        continue-on-error: true
        run: >-
          node --test --import tsx
          --test-name-pattern="only an authoritative paid provider event materializes the marketplace CustomerOrder"
          tests/customer-storefront-order-e2e-contract.test.ts

      - name: Diagnostic KDS approval routing contract
        continue-on-error: true
        run: node --test --import tsx tests/order-approval-routing.test.ts

      - name: Build
        run: npm run build

      - name: Normalize Vercel serverless ESM dependency graph
        run: node scripts/normalize-serverless-esm-imports.mjs

      - name: Validate normalized serverless TypeScript graph
        run: npm run lint

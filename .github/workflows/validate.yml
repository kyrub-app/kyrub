name: Validate Kyrub

on:
  push:
    branches: ['fix/diag-prebuild-chunk-runner']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align drawer route contract with approval base
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/app-routes.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = "'src/components/modals/B2CCartDrawer.tsx'";
          const after = "'src/components/modals/B2CCartDrawerApprovalBase.tsx'";
          if (!source.includes(before) && !source.includes(after)) {
            throw new Error('Expected cart drawer contract source was not found.');
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          if ! git diff --quiet -- tests/app-routes.test.ts; then
            git config user.name "kyrub-app"
            git config user.email "kyrub.app@gmail.com"
            git add tests/app-routes.test.ts
            git commit -m "Align app route drawer contract with approval base"
            git push origin HEAD:fix/diag-prebuild-chunk-runner
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Capture composed rules
        uses: actions/upload-artifact@v4
        with:
          name: composed-firestore-rules
          path: .firebase/firestore.combined.rules
          if-no-files-found: error
          retention-days: 3

      - name: MVP readiness
        run: npm run mvp:check

      - name: TypeScript
        run: npm run lint

      - name: Contract tests
        run: >-
          node --test --import tsx
          tests/identity-verification.test.ts
          tests/passkey-security.test.ts
          tests/work-eligibility-enforcement.test.ts
          tests/kyrubia-cloud-history-contract.test.ts
          tests/kyrubia-list-products-category-semantics.test.ts
          tests/kyrubia-operational-read-manual-bypass.test.ts
          tests/kyrubia-product-publication-by-id.test.ts
          tests/gamification-redemption-repository.test.ts
          tests/app-error-boundary.test.ts
          tests/production-health.test.ts
          tests/local-attendance-serverless-routing.test.ts

      - name: Prebuild contract suite
        run: node scripts/run-prebuild-tests.mjs

      - name: Bundle application
        run: npm --ignore-scripts run build

      - name: Normalize Vercel serverless ESM dependency graph
        run: node scripts/normalize-serverless-esm-imports.mjs

      - name: Validate normalized serverless TypeScript graph
        run: npm run lint

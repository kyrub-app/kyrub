name: Validate Kyrub

on:
  pull_request:
    branches: [main, feat/global-challenge-admin-repository]
  push:
    branches: [main, 'agent/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Capture composed rules
        uses: actions/upload-artifact@v4
        with:
          name: composed-firestore-rules
          path: .firebase/firestore.combined.rules
          if-no-files-found: error
          retention-days: 3

      - name: MVP readiness
        run: npm run mvp:check

      - name: TypeScript
        run: npm run lint

      - name: Contract tests
        run: >-
          node --test --import tsx
          tests/identity-verification.test.ts
          tests/passkey-security.test.ts
          tests/work-eligibility-enforcement.test.ts
          tests/kyrubia-cloud-history-contract.test.ts
          tests/kyrubia-list-products-category-semantics.test.ts
          tests/kyrubia-operational-read-manual-bypass.test.ts
          tests/kyrubia-product-publication-by-id.test.ts
          tests/gamification-redemption-repository.test.ts
          tests/gamification-redemption-persistence-security.test.ts
          tests/pitanga-xp-conversion-transaction.test.ts
          tests/pitanga-earn-transaction.test.ts
          tests/pitanga-spend-transaction.test.ts
          tests/pitanga-balance-reconciliation.test.ts
          tests/pitanga-balance-authority-inspection.test.ts
          tests/global-challenge-publication.test.ts
          tests/xp-ledger-persistence.test.ts
          tests/official-plan-pix.test.ts
          tests/official-plan-pix-provider.test.ts
          tests/app-error-boundary.test.ts
          tests/production-health.test.ts
          tests/local-attendance-serverless-routing.test.ts
          tests/order-approval-routing.test.ts
          tests/prepaid-renewal-api-handler.test.ts
          tests/prepaid-renewal-http-boundary.test.ts
          tests/prepaid-renewal-mercado-pago-verification.test.ts
          tests/prepaid-renewal-firebase-auth.test.ts
          tests/prepaid-renewal-integrated-orchestration.test.ts
          tests/subscription-contract-renewal.test.ts
          tests/marketplace-payment-expiry-contract.test.ts

      - name: Set up Java for isolated Firestore tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Global challenge API and transaction tests
        run: npm run test:global-challenges

      - name: Firestore Pitanga concurrency (emulator)
        run: >-
          npx --yes firebase-tools emulators:exec
          --config firebase.security.json
          --project kyrub-security-test
          --only firestore
          "node --test --import tsx tests/firestore-pitanga-concurrency.test.ts"

      - name: Prebuild validation
        run: npm run prebuild

      - name: Bundle application
        run: npm --ignore-scripts run build

      - name: Normalize Vercel serverless ESM dependency graph
        run: node scripts/normalize-serverless-esm-imports.mjs

      - name: Validate normalized serverless TypeScript graph
        run: npm run lint

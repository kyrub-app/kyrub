name: Validate Kyrub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Prebuild concurrency diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full prebuild suite concurrency 4
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.join(' '))")
          node --test --test-concurrency=4 --import tsx $FILES

      - name: Full prebuild suite concurrency 1
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.join(' '))")
          node --test --test-concurrency=1 --import tsx $FILES

      - name: Diagnostic suite complete
        run: echo "Full-suite concurrency diagnostic completed"

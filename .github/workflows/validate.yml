name: Validate Kyrub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: MVP readiness
        run: npm run mvp:check

      - name: TypeScript
        run: npm run lint

      - name: Contract tests
        run: >-
          node --test --import tsx
          tests/identity-verification.test.ts
          tests/passkey-security.test.ts
          tests/work-eligibility-enforcement.test.ts
          tests/kyrubia-cloud-history-contract.test.ts
          tests/kyrubia-list-products-category-semantics.test.ts
          tests/kyrubia-operational-read-manual-bypass.test.ts
          tests/kyrubia-product-publication-by-id.test.ts
          tests/gamification-redemption-repository.test.ts
          tests/app-error-boundary.test.ts
          tests/production-health.test.ts
          tests/local-attendance-serverless-routing.test.ts

      - name: Prebuild block A 0-24
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.slice(0,25).join(' '))")
          node --test --import tsx $FILES

      - name: Prebuild block B 25-49
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.slice(25,50).join(' '))")
          node --test --import tsx $FILES

      - name: Prebuild block C 50-74
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.slice(50,75).join(' '))")
          node --test --import tsx $FILES

      - name: Prebuild block D 75-99
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.slice(75,100).join(' '))")
          node --test --import tsx $FILES

      - name: Prebuild block E 100-124
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.slice(100,125).join(' '))")
          node --test --import tsx $FILES

      - name: Prebuild block F 125-end
        continue-on-error: true
        run: |
          FILES=$(node -e "const a=require('./package.json').scripts.prebuild.split(/\\s+/).filter(x=>x.startsWith('tests/')); console.log(a.slice(125).join(' '))")
          if [ -n "$FILES" ]; then node --test --import tsx $FILES; fi

      - name: Diagnostic suite complete
        run: echo "Prebuild suite bisect completed"

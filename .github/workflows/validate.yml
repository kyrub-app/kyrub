name: Validate Kyrub

on:
  push:
    branches: ['fix/diag-prebuild-chunk-runner']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-chunked-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/diag-prebuild-chunk-runner

      - name: Generate chunked prebuild runner
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const source = pkg.scripts.prebuild;
          const tests = source.split(/\s+/).filter(token => token.startsWith('tests/'));
          if (tests.length < 100) {
            throw new Error(`Unexpected prebuild test manifest size: ${tests.length}`);
          }

          const runner = `import { spawnSync } from 'node:child_process';

const TEST_FILES = ${JSON.stringify(tests, null, 2)};
const CHUNK_SIZE = 25;
const TEST_CONCURRENCY = 4;

for (let offset = 0; offset < TEST_FILES.length; offset += CHUNK_SIZE) {
  const chunk = TEST_FILES.slice(offset, offset + CHUNK_SIZE);
  const block = Math.floor(offset / CHUNK_SIZE) + 1;
  console.log(\`[prebuild] Running contract block \${block} (\${chunk.length} files)\`);
  const result = spawnSync(
    process.execPath,
    ['--test', \`--test-concurrency=\${TEST_CONCURRENCY}\`, '--import', 'tsx', ...chunk],
    { stdio: 'inherit', env: process.env }
  );
  if (result.error) throw result.error;
  if (result.status !== 0) process.exit(result.status ?? 1);
}
`;

          fs.writeFileSync('scripts/run-prebuild-tests.mjs', runner);
          pkg.scripts.prebuild =
            'npm run mvp:check && npm run lint && node scripts/run-prebuild-tests.mjs';
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Commit generated runner
        run: |
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add package.json scripts/run-prebuild-tests.mjs
          if git diff --cached --quiet; then
            echo "Chunked prebuild runner already generated"
            exit 0
          fi
          git commit -m "Run prebuild contracts in isolated chunks"
          git push origin HEAD:fix/diag-prebuild-chunk-runner

name: Firebase key attestation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/attest-firebase-writer-key.mjs'
      - 'scripts/lib/firebase-key-attestation.mjs'
      - 'tests/firebase-key-attestation.test.mjs'
      - '.github/workflows/firebase-key-attestation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/firebase-key-attestation.test.mjs

name: Temporary table item exclusion implementation

on:
  push:
    branches:
      - ux/table-item-exclusion

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused changes
        run: python scripts/temporary-table-item-exclusion.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Focused regression tests
        run: node --test --import tsx tests/table-item-exclusion.test.ts tests/table-operations.test.ts tests/local-attendance.test.ts
      - name: Commit implementation
        run: |
          rm .github/workflows/temporary-table-item-exclusion.yml
          rm scripts/temporary-table-item-exclusion.py
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add -A
          git commit -m "Add auditable table item exclusion"
          git push origin HEAD:ux/table-item-exclusion

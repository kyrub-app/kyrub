name: Temporary move table transfer action

on:
  push:
    branches:
      - ux/move-transfer-into-table-item-row

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply transfer row adjustment
        run: python3 .github/scripts/move-table-transfer-action.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Focused regression
        run: node --test --import tsx tests/table-transfer-row-action.test.ts tests/table-operations.test.ts tests/table-split-payment-history.test.ts
      - name: Full application build
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/temporary-move-table-transfer-action.yml
          rm .github/scripts/move-table-transfer-action.py
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add -A
          git commit -m "Move table transfer action into item row"
          git push origin HEAD:ux/move-transfer-into-table-item-row

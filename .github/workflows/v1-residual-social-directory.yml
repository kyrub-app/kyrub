name: V1 residual social directory consumers
on:
  pull_request:
    paths:
      - 'src/components/ProfileConnected*Bridge.tsx'
      - 'src/components/ProfileSocialMobileFirstBridge.tsx'
      - 'src/utils/communityPostConnections.ts'
      - 'tests/v1-residual-social-directory.test.ts'
      - '.github/workflows/v1-residual-social-directory.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test --import tsx tests/v1-residual-social-directory.test.ts

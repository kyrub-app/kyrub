name: Freelas authenticated HTTP homologation
on:
  pull_request:
    paths:
      - 'server/freelance/**'
      - 'server/payments/personalPix*.ts'
      - 'shared/personalPixDestination.ts'
      - 'server/admin/freelanceReview*.ts'
      - 'server/admin/freelanceFinancialReview*.ts'
      - 'shared/freelance*.ts'
      - 'server/identity/kyrubMfaAuthorization.ts'
      - 'shared/kyrubMfaPolicy.ts'
      - 'server.ts'
      - 'tests/freelance-auth-emulator-http.test.ts'
      - 'firestore*.rules'
      - 'firebase.security.json'
      - '.github/workflows/freelance-auth-emulator-http.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freelance-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088
      KYRUB_FREELANCE_LOCAL_HOMOLOGATION: 'true'
      KYRUB_PERSONAL_FINANCE_LOCAL_HOMOLOGATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Isolated Auth and Firestore HTTP journey
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore "node --test --import tsx tests/freelance-auth-emulator-http.test.ts" 2>&1 | tee freelance-http.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freelance-http-evidence
          path: freelance-http.log
          if-no-files-found: warn

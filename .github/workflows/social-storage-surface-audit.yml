name: Social storage surface audit
on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'public/**'
      - 'scripts/audit-social-storage-surfaces.mjs'
      - '.github/workflows/social-storage-surface-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory candidate storage and social access paths
        run: node scripts/audit-social-storage-surfaces.mjs | tee social-storage-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: social-storage-surface-audit
          path: social-storage-audit.txt
          if-no-files-found: error
          retention-days: 7

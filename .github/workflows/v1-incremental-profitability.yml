name: Incremental V1 profitability
on:
  push:
    branches: [release/v1-incremental-profitability-04]
  pull_request:
    branches: [release/kyrub-tag-permanent-stock]
    paths:
      - 'src/components/store/StoreResultsMarginsWorkspace.tsx'
      - 'tests/finance-results-margins-ui.test.ts'
      - '.github/workflows/v1-incremental-profitability.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test --import tsx tests/incremental-finance-history.test.ts tests/store-economic-ledger.test.ts tests/finance-results-margins-ui.test.ts tests/public-visit-card.test.ts
      - run: npm run build --ignore-scripts

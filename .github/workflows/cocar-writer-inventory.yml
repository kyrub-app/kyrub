name: Cocares writer inventory
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'scripts/**'
      - '**/*.rules'
      - '.github/workflows/cocar-writer-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inventory tracked XP references
        run: node scripts/audit-cocar-writers.mjs

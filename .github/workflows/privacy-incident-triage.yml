name: Privacy incident triage
on:
  pull_request:
    paths:
      - 'shared/privacyIncidentTriage.ts'
      - 'tests/privacy-incident-triage.test.ts'
      - '.github/workflows/privacy-incident-triage.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/privacy-incident-triage.test.ts

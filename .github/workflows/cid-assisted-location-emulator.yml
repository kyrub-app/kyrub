name: CID assisted location emulator
on:
  pull_request:
    paths:
      - 'server/identity/cidAccessObservationEmulator.ts'
      - 'server/identity/cidSosEmulatorStore.ts'
      - 'server/identity/cidOwnerCentralEmulator.ts'
      - 'tests/firestore-cid-assisted-location-emulator.test.ts'
      - '.github/workflows/cid-assisted-location-emulator.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Test minimized access and location pointer
        env:
          KYRUB_CID_SOS_EMULATOR: 'true'
          GCLOUD_PROJECT: demo-kyrub-cid-sos
          FIREBASE_PROJECT_ID: demo-kyrub-cid-sos
        run: npx --yes firebase-tools@15.35.0 emulators:exec --config firebase.security.json --project demo-kyrub-cid-sos --only firestore "node --test --test-concurrency=1 --import tsx tests/firestore-cid-assisted-location-emulator.test.ts"

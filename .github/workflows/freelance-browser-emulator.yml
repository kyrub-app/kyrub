name: Freelas isolated Chromium
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/FreelanceEmulatorEntry.tsx'
      - 'src/components/modals/Freela*.tsx'
      - 'src/components/UserNotificationCenterBridge.tsx'
      - 'src/utils/freelanceHiringCloud.ts'
      - 'src/utils/firebase.ts'
      - 'server/notifications/**'
      - 'scripts/firestore-rule-composition.mjs'
      - 'tests/freelance-browser-emulator.mjs'
      - '.github/workflows/freelance-browser-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freelance-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      PORT: '3000'
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088
      KYRUB_FREELANCE_NOTIFICATION_PREVIEW: 'true'
      VITE_KYRUB_FIREBASE_EMULATOR_E2E: 'true'
      VITE_KYRUB_FREELANCE_CLOUD_PREVIEW: 'true'
      VITE_KYRUB_FREELANCE_NOTIFICATION_PREVIEW: 'true'
      VITE_KYRUB_FREELANCE_BROWSER_EMULATOR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run firestore:compose
      - name: Verify two browser sessions against isolated Auth and Firestore
        run: |
          npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore 'bash -euo pipefail -c '\''node --import tsx server/notifications/freelancePreviewServer.ts > /tmp/kyrub-freelas.log 2>&1 & server_pid=$!; trap "kill $server_pid 2>/dev/null || true" EXIT; for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi; sleep 2; done; curl -fsS http://127.0.0.1:3000/ > /dev/null; node --import tsx tests/freelance-browser-emulator.mjs'\'''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freelance-browser-evidence
          path: |
            /tmp/kyrub-freelas.log
            freelance-emulator-*.png
          if-no-files-found: ignore
          retention-days: 3

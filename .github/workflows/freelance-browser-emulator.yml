name: Freelas isolated Chromium journey
on:
  pull_request:
    paths:
      - 'src/components/modals/*Freela*.tsx'
      - 'src/components/modals/PersonalPixSettings.tsx'
      - 'src/components/modals/WalletModal.tsx'
      - 'src/components/modals/UserProfileModal.tsx'
      - 'server/payments/personalPix*.ts'
      - 'server/identity/kyrubTagPasskey*.ts'
      - 'server/identity/kyrubTagPilotIsolation.ts'
      - 'tests/fixtures/kyrub-tag-software-authenticator.ts'
      - 'src/components/renda/*Freelance*.tsx'
      - 'src/components/renda/RendaActivityAlertsBell.tsx'
      - 'src/components/tabs/RendaTab.tsx'
      - 'src/utils/firebase.ts'
      - 'server/freelance/**'
      - 'server.ts'
      - 'tests/freelance-browser-emulator.mjs'
      - '.github/workflows/freelance-browser-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      PORT: '3000'
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088
      KYRUB_FREELANCE_LOCAL_HOMOLOGATION: 'true'
      VITE_KYRUB_FREELANCE_LOCAL_HOMOLOGATION: 'true'
      VITE_KYRUB_FIREBASE_EMULATOR_E2E: 'true'
      KYRUB_PERSONAL_FINANCE_LOCAL_HOMOLOGATION: 'true'
      VITE_KYRUB_PERSONAL_FINANCE_LOCAL_HOMOLOGATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: npm run firestore:compose
      - name: Actual browser journey against isolated local app
        run: |
          npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore 'bash -euo pipefail -c '\''npm run dev > /tmp/kyrub-freelance-server.log 2>&1 & server_pid=$!; trap "kill $server_pid 2>/dev/null || true" EXIT; for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi; sleep 2; done; curl -fsS http://127.0.0.1:3000/api/health; node --import tsx tests/freelance-browser-emulator.mjs'\'''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freelance-chromium-evidence
          path: |
            freelance-browser-evidence/
            /tmp/kyrub-freelance-server.log
          if-no-files-found: warn
          retention-days: 3

name: Note invitation bell isolated serverless
on:
  pull_request:
    paths:
      - 'server/notifications/**'
      - 'shared/userNotifications.ts'
      - 'tests/note-invitation-bell-serverless-emulator.test.ts'
      - '.github/workflows/note-invitation-bell-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:8088'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Exercise serverless notification transport in Firestore Emulator
        run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only firestore "node --test --test-concurrency=1 --import tsx tests/note-invitation-bell-serverless-emulator.test.ts tests/firestore-note-invitations.test.ts"

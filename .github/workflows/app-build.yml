name: Application build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and tests
        run: npm run prebuild > build.log 2>&1

      - name: Validate canonical header composition contract
        run: node --test --import tsx tests/header-composition-contract.test.ts tests/workspace-primary-navigation.test.ts tests/profile-dom-containment.test.ts tests/profile-next-polish.test.ts >> build.log 2>&1

      - name: Validate canonical Staff and ERP role boundaries
        run: node --test --import tsx tests/staff-fixed-homologation-contract.test.ts >> build.log 2>&1

      - name: Validate Staff PDV authorization boundaries
        run: node --test --import tsx tests/staff-pdv-authority-contract.test.ts tests/in-person-order-creation.test.ts >> build.log 2>&1

      - name: Validate fiscal production foundation
        run: node --test --test-concurrency=1 --import tsx tests/fiscal-production-authorization.test.ts tests/fiscal-production-authorization-registry.test.ts tests/fiscal-production-execution-prerequisites.test.ts tests/fiscal-production-executor-foundation.test.ts tests/fiscal-production-attempt-ledger-contract.test.ts tests/fiscal-production-outcome.test.ts tests/fiscal-production-outcome-ledger-contract.test.ts tests/focus-nfce-production-transport.test.ts tests/fiscal-production-focus-orchestrator.test.ts >> build.log 2>&1

      - name: Validate marketplace payment expiry contract
        run: node --test --import tsx tests/marketplace-payment-expiry-contract.test.ts >> build.log 2>&1

      - name: Validate paid plan billing contract
        run: node --test --import tsx tests/paid-plan-billing.test.ts >> build.log 2>&1

      - name: Validate payment refund contract
        run: node --test --import tsx tests/payment-refund-contract.test.ts >> build.log 2>&1

      - name: Validate KDS order status authentication contract
        run: node --test --import tsx tests/order-status-auth-contract.test.ts >> build.log 2>&1

      - name: Validate scoped order rejection contract
        run: node --test --import tsx tests/order-rejection-scope-contract.test.ts >> build.log 2>&1

      - name: Validate partial cancellation inventory contract
        run: node --test --import tsx tests/partial-cancellation-inventory-contract.test.ts >> build.log 2>&1

      - name: Bundle application
        run: npm --ignore-scripts run build >> build.log 2>&1

      - name: Normalize Vercel serverless ESM dependency graph
        run: node scripts/normalize-serverless-esm-imports.mjs >> build.log 2>&1

      - name: Validate normalized serverless TypeScript graph
        run: npm run lint >> build.log 2>&1

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-build-log
          path: build.log
          retention-days: 3

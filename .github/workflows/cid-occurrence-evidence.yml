name: CID occurrence evidence isolated policy
on:
  pull_request:
    paths:
      - 'server/identity/cidOccurrenceReport.ts'
      - 'server/identity/cidEvidencePreservation.ts'
      - 'server/identity/cidOccurrenceChatAccess.ts'
      - 'tests/cid-occurrence-evidence.test.ts'
      - '.github/workflows/cid-occurrence-evidence.yml'
permissions:
  contents: read
jobs:
  evidence-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/cid-occurrence-evidence.test.ts

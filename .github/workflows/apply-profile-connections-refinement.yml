name: Apply profile connections refinement

on:
  push:
    branches:
      - feat/profile-react-rebuild
    paths:
      - scripts/refine-profile-connected-tabs.mjs
      - .github/workflows/apply-profile-connections-refinement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/profile-react-rebuild
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply refinement
        run: node scripts/refine-profile-connected-tabs.mjs

      - name: Commit generated source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProfileSocialHubNative.tsx
          git commit -m "Refine connected navigation and new contacts modal"
          git push origin HEAD:feat/profile-react-rebuild

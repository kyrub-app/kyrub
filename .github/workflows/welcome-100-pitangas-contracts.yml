name: Welcome 100 Pitangas isolated contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/gamification/firstLoginWelcome.ts'
      - 'server/gamification/welcomeInitialSession.ts'
      - 'server/gamification/firstLoginReceiptVerification.ts'
      - 'server/gamification/firstLoginReceiptWriter.ts'
      - 'server/gamification/welcomeTrustedAuthRegistration.ts'
      - 'server/gamification/cleanBaselineWelcomeTransaction.ts'
      - 'server/gamification/signedSessionWelcomeService.ts'
      - 'server/gamification/welcomeFirebaseSession.ts'
      - 'server/gamification/welcomeAuthenticatedGrant.ts'
      - 'tests/first-login-welcome-100-contract.test.ts'
      - 'tests/welcome-initial-session-100-contract.test.ts'
      - 'tests/clean-baseline-welcome-100.test.ts'
      - 'tests/signed-session-welcome-100-service.test.ts'
      - 'tests/welcome-100-firestore-emulator.test.ts'
      - 'tests/welcome-trusted-receipt-emulator.test.ts'
      - 'tests/first-login-receipt-writer.test.ts'
      - 'tests/welcome-trusted-auth-registration.test.ts'
      - 'tests/welcome-firebase-session.test.ts'
      - 'tests/welcome-authenticated-grant.test.ts'
      - '.github/workflows/welcome-100-pitangas-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run isolated welcome contract and transaction tests
        run: >-
          node --test --import tsx
          tests/first-login-welcome-100-contract.test.ts
          tests/welcome-initial-session-100-contract.test.ts
          tests/clean-baseline-welcome-100.test.ts
          tests/signed-session-welcome-100-service.test.ts
          tests/welcome-firebase-session.test.ts
          tests/welcome-authenticated-grant.test.ts
          tests/first-login-receipt-writer.test.ts
          tests/welcome-trusted-auth-registration.test.ts
      - name: Verify atomic welcome grant against isolated Firestore Emulator
        run: >-
          npx --yes firebase-tools emulators:exec
          --config firebase.security.json
          --project kyrub-security-test
          --only firestore
          "node --test --test-concurrency=1 --import tsx tests/welcome-100-firestore-emulator.test.ts tests/welcome-trusted-receipt-emulator.test.ts"

name: Welcome 100 Pitangas isolated contracts

on:
  pull_request:
    branches: [main, test-gamification-transversal-browser]
    paths:
      - 'server/gamification/pitangaAccount*.ts'
      - 'server/gamification/semeadura*.ts'
      - 'src/components/SemearButton.tsx'
      - 'src/components/SemeaduraJourneyPanel.tsx'
      - 'tests/firestore-semeadura.test.ts'
      - 'tests/pitangueira-*.test.ts'
      - 'src/components/tabs/PitangaAccount.tsx'
      - 'tests/pitanga-account*.test.ts'
      - 'api/health.ts'
      - 'vercel.json'
      - 'server/gamification/firstLoginWelcome.ts'
      - 'server/gamification/welcomeInitialSession.ts'
      - 'server/gamification/firstLoginReceiptVerification.ts'
      - 'server/gamification/firstLoginReceiptWriter.ts'
      - 'server/gamification/welcomeTrustedAuthRegistration.ts'
      - 'server/gamification/welcomeAuthCreatedHandler.ts'
      - 'functions/**'
      - 'firebase.welcome.json'
      - 'scripts/build-welcome-functions.mjs'
      - 'tests/welcome-auth-created-emulator.test.ts'
      - 'scripts/inventory-pitanga-writers.mjs'
      - 'scripts/audit-canonical-pitanga-callers.mjs'
      - 'server/gamification/cleanBaselineWelcomeTransaction.ts'
      - 'server/gamification/pitangaLegacyWriterFence.ts'
      - 'server/gamification/pitangaEarnTransaction.ts'
      - 'server/gamification/pitangaSpendTransaction.ts'
      - 'server/gamification/pitangaXpConversionTransaction.ts'
      - 'server/gamification/pitangaVoucherIssuanceTransaction.ts'
      - 'server/gamification/cleanBaselineSpendingEligibility.ts'
      - 'server/gamification/cleanBaselineVerifiedSpend.ts'
      - 'server/gamification/cleanBaselineVerifiedXpConversion.ts'
      - 'server/gamification/cleanBaselineVerifiedVoucherIssuance.ts'
      - 'server/gamification/pitangaVerifiedXpConversion.ts'
      - 'server/gamification/pitangaMigrationBootstrapTransaction.ts'
      - 'server/gamification/pitangaMigrationVerifiedBootstrap.ts'
      - 'server/gamification/pitangaMigrationCheckpointVerification.ts'
      - 'server/gamification/pitangaVerifiedVoucherIssuance.ts'
      - 'tests/pitanga-legacy-writer-fence.test.ts'
      - 'server/gamification/signedSessionWelcomeService.ts'
      - 'server/gamification/welcomeFirebaseSession.ts'
      - 'server/gamification/welcomeAuthenticatedGrant.ts'
      - 'tests/first-login-welcome-100-contract.test.ts'
      - 'tests/welcome-initial-session-100-contract.test.ts'
      - 'tests/clean-baseline-welcome-100.test.ts'
      - 'tests/signed-session-welcome-100-service.test.ts'
      - 'tests/welcome-100-firestore-emulator.test.ts'
      - 'tests/welcome-trusted-receipt-emulator.test.ts'
      - 'tests/first-login-receipt-writer.test.ts'
      - 'tests/welcome-trusted-auth-registration.test.ts'
      - 'tests/welcome-firebase-session.test.ts'
      - 'tests/welcome-authenticated-grant.test.ts'
      - '.github/workflows/welcome-100-pitangas-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run isolated welcome contract and transaction tests
        run: >-
          node --test --import tsx
          tests/pitangueira-semeadura-service.test.ts
          tests/pitangueira-ui-contract.test.ts
          tests/pitanga-account-handler.test.ts
          tests/pitanga-account-ui.test.ts
          tests/first-login-welcome-100-contract.test.ts
          tests/welcome-initial-session-100-contract.test.ts
          tests/clean-baseline-welcome-100.test.ts
          tests/pitanga-legacy-writer-fence.test.ts
          tests/signed-session-welcome-100-service.test.ts
          tests/welcome-firebase-session.test.ts
          tests/welcome-authenticated-grant.test.ts
          tests/first-login-receipt-writer.test.ts
          tests/welcome-trusted-auth-registration.test.ts
      - name: Compose rules for seed receipt regression
        run: npm run firestore:compose
      - name: Verify author-only permanent seeds in Firestore Emulator
        run: >-
          npx --yes firebase-tools emulators:exec
          --config firebase.security.json --project kyrub-security-test --only firestore
          "node --test --test-concurrency=1 --import tsx tests/firestore-semeadura.test.ts"
      - name: Verify atomic welcome grant against isolated Firestore Emulator
        run: >-
          npx --yes firebase-tools emulators:exec
          --config firebase.security.json
          --project kyrub-security-test
          --only firestore
          "node --test --test-concurrency=1 --import tsx tests/welcome-100-firestore-emulator.test.ts tests/welcome-trusted-receipt-emulator.test.ts"

  auth-created-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-kyrub-welcome
      GOOGLE_CLOUD_PROJECT: demo-kyrub-welcome
      KYRUB_PITANGA_WELCOME_PROJECT_ID: demo-kyrub-welcome
      KYRUB_PITANGA_SIGNED_SESSION_WELCOME_ENABLED: 'true'
      KYRUB_SEMEADURA_NO_WELCOME_PILOT: 'true'
      KYRUB_WELCOME_BONUS_EFFECTIVE_AT: '2026-11-15T00:00:00.000Z'
      KYRUB_PITANGA_WELCOME_FENCE_EPOCH: welcome-emulator-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx tsc --project functions/tsconfig.json
      - run: npm run firestore:compose
      - run: node scripts/build-welcome-functions.mjs
      - name: Verify automatic registration credit and authenticated replay in isolated emulators
        run: >-
          npx --yes firebase-tools emulators:exec
          --config firebase.welcome.json --project demo-kyrub-welcome
          --only auth,firestore,functions
          "node --test --test-concurrency=1 --import tsx tests/welcome-auth-created-emulator.test.ts"

  pitanga-writer-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate tracked Pitanga writer candidates (audit only)
        run: node scripts/inventory-pitanga-writers.mjs > pitanga-writer-inventory.txt
      - name: Audit canonical writer call sites (report outstanding blockers)
        run: |
          node scripts/audit-canonical-pitanga-callers.mjs > pitanga-canonical-callers.json || echo 'Canonical writer audit reports unresolved call sites; review artifact before release.'
      - name: Publish canonical writer audit as review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitanga-canonical-callers
          path: pitanga-canonical-callers.json
          retention-days: 14
      - name: Publish inventory as review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitanga-writer-inventory
          path: pitanga-writer-inventory.txt
          retention-days: 14

  pitanga-release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block release on unclassified canonical writer call sites
        run: node scripts/audit-canonical-pitanga-callers.mjs
      - name: Block release until deployed and external writers are independently verified
        run: |
          echo 'BLOCKED: repository audit does not establish deployed revision or external writer coverage.'
          echo 'Do not set writersVerified=true or enable the welcome campaign.'
          exit 1

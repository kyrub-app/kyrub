name: CID SOS isolated form
on:
  pull_request:
    paths:
      - 'src/components/KyrubCidSosAlertForm.tsx'
      - 'shared/cidSosRequest.ts'
      - 'tests/cid-sos-alert-form.test.tsx'
      - '.github/workflows/cid-sos-form.yml'
permissions:
  contents: read
jobs:
  form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/cid-sos-alert-form.test.tsx

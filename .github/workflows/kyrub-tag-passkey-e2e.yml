name: Kyrub Tag Passkey isolated end to end
on:
  pull_request:
    paths:
      - 'server/identity/kyrubTagPasskey*.ts'
      - 'server/identity/kyrubTagService.ts'
      - 'server/identity/kyrubTagPilotIsolation.ts'
      - 'tests/kyrub-tag-passkey-emulator.test.ts'
      - 'tests/fixtures/kyrub-tag-software-authenticator.ts'
      - '.github/workflows/kyrub-tag-passkey-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Verify the entire lifecycle with a software authenticator and local emulators
        env:
          KYRUB_TAG_PASSKEY_E2E: 'true'
          FIREBASE_PROJECT_ID: demo-kyrub-tag-passkey-e2e
          GCLOUD_PROJECT: demo-kyrub-tag-passkey-e2e
          KYRUB_TAG_PASSKEY_PILOT_ENABLED: 'true'
          KYRUB_TAG_PROMO_FIRST_CLAIM_ENABLED: 'true'
          VERCEL_ENV: preview
          VERCEL_BRANCH_URL: kyrub-tag-e2e.vercel.app
          VERCEL_URL: kyrub-tag-e2e-immutable.vercel.app
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.35.0 emulators:exec --config firebase.security.json --project demo-kyrub-tag-passkey-e2e --only firestore,auth "node --test --test-concurrency=1 --import tsx tests/kyrub-tag-passkey-emulator.test.ts" 2>&1 | tee passkey-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyrub-tag-passkey-e2e-log
          path: passkey-e2e.log
          if-no-files-found: ignore
          retention-days: 7

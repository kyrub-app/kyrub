name: Apply KDS order card visual hierarchy to PR804

on:
  push:
    branches:
      - refine/kds-mobile-layout
    paths:
      - .github/workflows/apply-kds-order-card-visual-hierarchy-pr804.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/kds-mobile-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply alternating cards and semantic status accents
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/customer/CustomerOrderInbox.tsx')
          text = path.read_text()

          marker = "export const CustomerOrderInbox = ({\n"
          if text.count(marker) != 1:
              raise SystemExit('CustomerOrderInbox component marker mismatch')

          helper = r'''type OrderCardVisualTone = {
            card: string;
            headerBorder: string;
            statusBadge: string;
          };

          const getOrderCardVisualTone = (
            order: CustomerOrder,
            orderIndex: number,
            pickupWaiting: boolean
          ): OrderCardVisualTone => {
            const alternatingBackground = orderIndex % 2 === 0
              ? 'bg-slate-800/80'
              : 'bg-slate-900/95';

            if (pickupWaiting) {
              return {
                card: `${alternatingBackground} border-cyan-400/45 border-l-4 border-l-cyan-400 shadow-lg shadow-cyan-950/20`,
                headerBorder: 'border-cyan-400/20',
                statusBadge: 'border-cyan-400/30 bg-cyan-400/10 text-cyan-200',
              };
            }

            switch (order.status) {
              case 'pending':
                return {
                  card: `${alternatingBackground} border-amber-400/35 border-l-4 border-l-amber-400 shadow-lg shadow-amber-950/20`,
                  headerBorder: 'border-amber-400/20',
                  statusBadge: 'border-amber-400/30 bg-amber-400/10 text-amber-200',
                };
              case 'accepted':
              case 'preparing':
                return {
                  card: `${alternatingBackground} border-orange-400/35 border-l-4 border-l-orange-400 shadow-lg shadow-orange-950/20`,
                  headerBorder: 'border-orange-400/20',
                  statusBadge: 'border-orange-400/30 bg-orange-400/10 text-orange-200',
                };
              case 'ready':
                return {
                  card: `${alternatingBackground} border-emerald-400/35 border-l-4 border-l-emerald-400 shadow-lg shadow-emerald-950/20`,
                  headerBorder: 'border-emerald-400/20',
                  statusBadge: 'border-emerald-400/30 bg-emerald-400/10 text-emerald-200',
                };
              case 'out_for_delivery':
                return {
                  card: `${alternatingBackground} border-sky-400/35 border-l-4 border-l-sky-400 shadow-lg shadow-sky-950/20`,
                  headerBorder: 'border-sky-400/20',
                  statusBadge: 'border-sky-400/30 bg-sky-400/10 text-sky-200',
                };
              case 'rejected':
              case 'cancelled':
                return {
                  card: `${alternatingBackground} border-red-400/30 border-l-4 border-l-red-400`,
                  headerBorder: 'border-red-400/20',
                  statusBadge: 'border-red-400/30 bg-red-400/10 text-red-200',
                };
              case 'completed':
              default:
                return {
                  card: `${alternatingBackground} border-slate-600/60 border-l-4 border-l-slate-500`,
                  headerBorder: 'border-slate-700',
                  statusBadge: 'border-slate-600 bg-slate-950/60 text-slate-300',
                };
            }
          };

          '''
          text = text.replace(marker, helper + marker, 1)

          replacements = [
            ("{filteredOrders.map(order => {", "{filteredOrders.map((order, orderIndex) => {", 'order map'),
            ("            const pickupWaiting = isPickupWaiting(order);\n\n            return (", "            const pickupWaiting = isPickupWaiting(order);\n            const cardTone = getOrderCardVisualTone(order, orderIndex, pickupWaiting);\n\n            return (", 'pickup'),
            ("                className={`flex flex-col overflow-hidden rounded-3xl border bg-slate-950 focus:outline-none focus:ring-2 focus:ring-emerald-400/60 ${pickupWaiting ? 'border-cyan-500/30' : 'border-slate-800'}`}", "                className={`flex flex-col overflow-hidden rounded-3xl border transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-400/60 ${cardTone.card}`}", 'article class'),
            ('                <div className="flex items-start justify-between gap-2.5 border-b border-slate-800 p-3 sm:p-4">', '                <div className={`flex items-start justify-between gap-2.5 border-b p-3 sm:p-4 ${cardTone.headerBorder}`}>', 'header'),
            ("                  <span className={`max-w-[46%] rounded-full border px-2.5 py-1 text-center text-[9px] font-black uppercase ${pickupWaiting ? 'border-cyan-500/25 bg-cyan-500/10 text-cyan-200' : 'border-slate-700 bg-slate-900 text-slate-300'}`}>{pickupWaiting ? 'Aguardando retirada' : getCustomerOrderStatusLabel(order.status)}</span>", "                  <span className={`max-w-[46%] rounded-full border px-2.5 py-1 text-center text-[9px] font-black uppercase ${cardTone.statusBadge}`}>{pickupWaiting ? 'Aguardando retirada' : getCustomerOrderStatusLabel(order.status)}</span>", 'status badge'),
            ('                        <div key={item.lineId} className="rounded-2xl border border-slate-800 bg-slate-900/70 p-3">', '                        <div key={item.lineId} className="rounded-2xl border border-slate-700/80 bg-slate-950/55 p-3">', 'item card'),
            ('                  <div className="space-y-2 rounded-2xl border border-slate-800 bg-slate-900/50 p-3 text-[10px] text-slate-400">', '                  <div className="space-y-2 rounded-2xl border border-slate-700/80 bg-slate-950/45 p-3 text-[10px] text-slate-300">', 'customer detail'),
          ]
          for old, new, label in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'{label} marker mismatch: {text.count(old)}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run lint
      - name: Validate focused contract
        run: node --test --import tsx tests/order-approval-routing.test.ts
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/apply-kds-order-card-visual-hierarchy-pr804.yml
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add src/components/customer/CustomerOrderInbox.tsx .github/workflows/apply-kds-order-card-visual-hierarchy-pr804.yml
          git commit -m "Refine KDS order card visual hierarchy"
          git push origin HEAD:refine/kds-mobile-layout

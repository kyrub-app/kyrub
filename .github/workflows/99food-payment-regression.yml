name: 99Food payment and operational regression

on:
  push:
    branches:
      - feat/profile-react-rebuild
    paths:
      - 'server/inventory/ninetyNineFoodInboundStatusAuthorityService.ts'
      - 'server/integrations/openDelivery.ts'
      - 'server/integrations/ninetyNineFoodService.ts'
      - 'tests/ninety-nine-food-inbound-payment-gate.test.ts'
      - 'tests/open-delivery-payment-gate.test.ts'
      - 'tests/open-delivery-99food.test.ts'
      - 'tests/99food-integration-contract.test.ts'
      - 'tests/99food-explicit-status-write-authority.test.ts'
      - 'tests/production-station-routing.test.ts'
      - 'tests/order-inventory-consumption.test.ts'
      - 'tests/store-economic-ledger.test.ts'
      - '.github/workflows/99food-payment-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  payment-status-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run 99Food, KDS, order, inventory and ledger regression tests
        id: regression
        run: >-
          node --test --test-concurrency=4 --import tsx
          tests/open-delivery-payment-gate.test.ts
          tests/ninety-nine-food-inbound-payment-gate.test.ts
          tests/open-delivery-99food.test.ts
          tests/99food-integration-contract.test.ts
          tests/99food-explicit-status-write-authority.test.ts
          tests/production-station-routing.test.ts
          tests/order-inventory-consumption.test.ts
          tests/store-economic-ledger.test.ts

      - name: Publish regression result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [ "$REGRESSION_OUTCOME" = "success" ]; then
            state=success
            description="99Food, KDS, inventory and ledger regression passed"
          else
            state=failure
            description="99Food, KDS, inventory or ledger regression failed"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="99Food operational regression" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: Diagnose PR 803 prebuild

on:
  push:
    branches:
      - fix/merchant-approval-before-payment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run prebuild and capture output
        id: prebuild
        shell: bash
        run: |
          set +e
          npm run prebuild > prebuild.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 250 prebuild.log > prebuild-tail.log
          exit 0
      - name: Persist failure tail on diagnostic branch head
        if: steps.prebuild.outputs.exit_code != '0'
        shell: bash
        run: |
          cp prebuild-tail.log .github/pr803-prebuild-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr803-prebuild-tail.txt
          git commit -m "chore: persist PR 803 prebuild tail [skip ci]"
          git push origin HEAD:fix/merchant-approval-before-payment
      - name: Fail after diagnostic capture
        if: steps.prebuild.outputs.exit_code != '0'
        run: exit 1

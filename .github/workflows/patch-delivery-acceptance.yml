name: Patch delivery acceptance persistence

on:
  push:
    branches:
      - agent/order-approval-origin-delivery-queue
    paths:
      - .github/workflows/patch-delivery-acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/order-approval-origin-delivery-queue
      - name: Wire cloud delivery acceptance
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/modals/DeliveryManagerModal.tsx')
          source = path.read_text()

          replacements = [
            (
              "import { db } from '../../utils/firebase';\nimport { deleteDoc, doc } from 'firebase/firestore';\nimport { DeliveryJob } from '../../types';\n",
              "import { auth, db } from '../../utils/firebase';\nimport { deleteDoc, doc } from 'firebase/firestore';\nimport { DeliveryJob } from '../../types';\nimport {\n  getKyrubDeliveryDocumentPath,\n  updateKyrubDeliveryOpportunityStatus,\n} from '../../utils/deliveryOpportunities';\n",
            ),
            (
              "      await deleteDoc(doc(db, 'delivery_jobs', id));",
              "      await deleteDoc(doc(db, getKyrubDeliveryDocumentPath(id)));",
            ),
            (
              """  // Accept delivery
  const handleAcceptDelivery = (jobId: string) => {
    setDeliveries(prev =>
      prev.map(d => {
        if (d.id !== jobId) return d;
        triggerToast(`Entrega de ${d.from} aceita! Vá até a loja para coletar o pacote.`, 'success');
        return { ...d, status: 'accepted', acceptedBy: profileName || 'Você', updatedAt: new Date().toISOString() };
      })
    );
  };

  // Advance delivery status
  const handleAdvanceDelivery = (jobId: string, nextStatus: 'delivering' | 'done') => {
    setDeliveries(prev =>
      prev.map(d => {
        if (d.id !== jobId) return d;
        if (nextStatus === 'done') {
          setWalletBalance(curr => curr + d.payment);
          setWalletHistory(currHistory => [
            { id: `tx-del-${Date.now()}`, type: 'Logística', desc: `Faturamento de entrega ID ${d.id}`, val: d.payment, date: new Date().toLocaleString('pt-BR') },
            ...currHistory
          ]);
          triggerToast(`Pacote entregue! R$ ${d.payment.toFixed(2)} adicionados à sua carteira.`, 'success');
        } else {
          triggerToast(`Pacote coletado. A caminho do destino final!`, 'info');
        }
        return { ...d, status: nextStatus, updatedAt: new Date().toISOString() };
      })
    );
  };
""",
              """  // Accept delivery. Opportunities generated from orders are persisted so
  // the three-minute fallback worker sees the acceptance immediately.
  const handleAcceptDelivery = async (jobId: string) => {
    const user = auth.currentUser;
    const current = deliveries.find(delivery => delivery.id === jobId);
    if (!current) return;

    try {
      if (jobId.startsWith('order-')) {
        if (!user) throw new Error('Faça login novamente para aceitar a entrega.');
        await updateKyrubDeliveryOpportunityStatus(jobId, 'accepted', user);
      }
      setDeliveries(prev =>
        prev.map(delivery =>
          delivery.id === jobId
            ? {
                ...delivery,
                status: 'accepted',
                acceptedBy: user?.uid || profileName || 'Você',
              }
            : delivery
        )
      );
      triggerToast(
        `Entrega de ${current.from} aceita! Vá até a loja para coletar o pacote.`,
        'success'
      );
    } catch (error) {
      triggerToast(
        error instanceof Error
          ? error.message
          : 'Não foi possível aceitar esta entrega.',
        'error'
      );
    }
  };

  // Advance delivery status and keep cloud opportunities synchronized.
  const handleAdvanceDelivery = async (
    jobId: string,
    nextStatus: 'delivering' | 'done'
  ) => {
    const user = auth.currentUser;
    const current = deliveries.find(delivery => delivery.id === jobId);
    if (!current) return;

    try {
      if (jobId.startsWith('order-')) {
        if (!user) throw new Error('Faça login novamente para atualizar a entrega.');
        await updateKyrubDeliveryOpportunityStatus(jobId, nextStatus, user);
      }
      setDeliveries(prev =>
        prev.map(delivery =>
          delivery.id === jobId
            ? { ...delivery, status: nextStatus }
            : delivery
        )
      );
      if (nextStatus === 'done') {
        setWalletBalance(curr => curr + current.payment);
        setWalletHistory(currHistory => [
          {
            id: `tx-del-${Date.now()}`,
            type: 'Logística',
            desc: `Faturamento de entrega ID ${current.id}`,
            val: current.payment,
            date: new Date().toLocaleString('pt-BR'),
          },
          ...currHistory,
        ]);
        triggerToast(
          `Pacote entregue! R$ ${current.payment.toFixed(2)} adicionados à sua carteira.`,
          'success'
        );
      } else {
        triggerToast('Pacote coletado. A caminho do destino final!', 'info');
      }
    } catch (error) {
      triggerToast(
        error instanceof Error
          ? error.message
          : 'Não foi possível atualizar esta entrega.',
        'error'
      );
    }
  };
""",
            ),
            ("onClick={() => handleAcceptDelivery(d.id)}", "onClick={() => void handleAcceptDelivery(d.id)}"),
            ("onClick={() => handleAdvanceDelivery(d.id, 'delivering')}", "onClick={() => void handleAdvanceDelivery(d.id, 'delivering')}"),
            ("onClick={() => handleAdvanceDelivery(d.id, 'done')}", "onClick={() => void handleAdvanceDelivery(d.id, 'done')}"),
          ]

          for old, new in replacements:
            if old not in source:
              raise SystemExit(f'Modal replacement not found: {old[:120]!r}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git rm .github/workflows/patch-delivery-acceptance.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modals/DeliveryManagerModal.tsx .github/workflows/patch-delivery-acceptance.yml
          git commit -m "Persist courier acceptance in Kyrub Entregas"
          git push origin HEAD:agent/order-approval-origin-delivery-queue

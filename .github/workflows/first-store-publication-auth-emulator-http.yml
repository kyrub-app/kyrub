name: First store publication Auth Emulator HTTP
on:
  pull_request:
    paths:
      - 'tests/first-store-publication-auth-emulator-http.test.ts'
      - 'tests/freelance-hiring-http-emulator.test.ts'
      - 'server/notifications/freelanceNotificationService.ts'
      - 'server/notifications/userNotificationRouter.ts'
      - 'server/notifications/userCommunicationPreferenceRouter.ts'
      - 'server/gamification/firstStorePublicationHandler.ts'
      - 'server.ts'
      - 'server/identity/ageScreeningRouter.ts'
      - 'server/identity/ageEligibilityService.ts'
      - 'shared/ageEligibility.ts'
      - 'tests/age-screening-http-emulator.test.ts'
      - 'tests/age-screening-isolation.test.ts'
      - 'tests/kyrub-tag-publication-emulator.test.ts'
      - 'server/identity/kyrubTagService.ts'
      - 'server/identity/kyrubTagPublicationPolicy.ts'
      - 'shared/kyrubTagPublicationTerms.ts'
      - '.github/workflows/first-store-publication-auth-emulator-http.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-emulator-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088
      KYRUB_FIRST_STORE_PUBLICATION_E2E_LOCAL: 'true'
      KYRUB_FIRST_STORE_PUBLICATION_SERVER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Compose Firestore security rules (fail closed)
        run: npm run firestore:compose
      - name: Real HTTP authentication against isolated Firebase emulators
        run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore "node --test --import tsx tests/first-store-publication-auth-emulator-http.test.ts"

      - name: Verify age screening against isolated Auth and Firestore
        env:
          FIREBASE_PROJECT_ID: demo-kyrub-onboarding
          GCLOUD_PROJECT: demo-kyrub-onboarding
          GOOGLE_CLOUD_PROJECT: demo-kyrub-onboarding
          KYRUB_AGE_SCREENING_EMULATOR: 'true'
          KYRUB_FIRST_STORE_PUBLICATION_E2E_LOCAL: 'false'
          KYRUB_FIRST_STORE_PUBLICATION_SERVER_ENABLED: 'false'
        run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project demo-kyrub-onboarding --only auth,firestore "node --test --import tsx tests/age-screening-http-emulator.test.ts"

      - name: Verify promotional Tag lifecycle with synthetic age evidence
        env:
          FIREBASE_PROJECT_ID: demo-kyrub-onboarding
          GCLOUD_PROJECT: demo-kyrub-onboarding
          GOOGLE_CLOUD_PROJECT: demo-kyrub-onboarding
          KYRUB_TAG_PROMO_FIRST_CLAIM_ENABLED: 'true'
          KYRUB_TAG_PUBLICATION_ENABLED: 'true'
          KYRUB_FIRST_STORE_PUBLICATION_E2E_LOCAL: 'false'
          KYRUB_FIRST_STORE_PUBLICATION_SERVER_ENABLED: 'false'
        run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project demo-kyrub-onboarding --only auth,firestore "node --test --import tsx tests/kyrub-tag-publication-emulator.test.ts"


      - name: Verify authenticated freelance hiring and private bell notifications
        env:
          KYRUB_FREELANCE_NOTIFICATION_PREVIEW: 'true'
          KYRUB_FIRST_STORE_PUBLICATION_E2E_LOCAL: 'false'
          KYRUB_FIRST_STORE_PUBLICATION_SERVER_ENABLED: 'false'
        run: npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore "node --test --import tsx tests/freelance-hiring-http-emulator.test.ts"

name: Cocares visual contract
on:
  pull_request:
    paths:
      - 'src/components/PublicSocialFeedPanel.tsx'
      - 'src/components/ReputationSquarePreview.tsx'
      - 'src/components/PublicProfileExperience.tsx'
      - 'shared/cocarDisplay.ts'
      - 'tests/cocar-visual-*'
      - '.github/workflows/cocar-visual-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      PORT: '3000'
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:8088'
      KYRUB_FREELANCE_LOCAL_HOMOLOGATION: 'true'
      VITE_KYRUB_FREELANCE_LOCAL_HOMOLOGATION: 'true'
      VITE_KYRUB_FIREBASE_EMULATOR_E2E: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_INDEX_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_CERTIFIED_READ_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_PUBLIC_EXPERIENCE_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_PUBLIC_REPUTATION_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_SQUARE_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_SQUARE_PUBLISH_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_SQUARE_FORWARD_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_DIRECT_FORWARD_TEST_ONLY: 'true'
      VITE_KYRUB_FREELANCE_REPUTATION_COCAR_HEADER_TEST_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run firestore:compose
      - name: Run isolated visual component contract
        run: |
          npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore 'bash -euo pipefail -c '\''npm run dev > /tmp/cocar-visual-server.log 2>&1 & server_pid=$!; trap "kill $server_pid 2>/dev/null || true" EXIT; for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi; sleep 2; done; curl -fsS http://127.0.0.1:3000/api/health; node tests/cocar-visual-browser.mjs'\'''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocar-visual-evidence
          path: |
            cocar-visual-evidence/
            /tmp/cocar-visual-server.log
          if-no-files-found: warn

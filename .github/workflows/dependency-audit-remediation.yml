name: Dependency audit remediation candidate

on:
  push:
    branches:
      - fix/production-dependency-audit-oct2026
    paths:
      - .github/workflows/dependency-audit-remediation.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dependency-audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediation-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate and commit security lockfile candidate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): synchronize patched production dependency lockfile'
            git push origin HEAD:fix/production-dependency-audit-oct2026
          fi
      - name: Install candidate locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply compatible npm security fixes
        run: npm audit fix --omit=dev --ignore-scripts || true
      - name: Inspect remaining vulnerable dependency chains
        run: |
          npm ls zod uuid @vercel/cli-config @vercel/oidc gaxios || true
          npm audit --omit=dev --json > audit-remediation.json || true
      - name: Verify reproducible lockfile
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check TypeScript compatibility
        run: npm run lint
      - name: Export reviewed dependency candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-candidate
          path: |
            package.json
            package-lock.json
            audit-remediation.json
          retention-days: 3

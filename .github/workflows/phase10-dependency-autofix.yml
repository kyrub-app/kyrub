name: Phase 10 dependency autofix

on:
  push:
    branches:
      - validate/phase-10-integrated-v1
    paths:
      - '.github/workflows/phase10-dependency-autofix.yml'
      - 'package-lock.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  audit-fix-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: validate/phase-10-integrated-v1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply safe npm audit fixes to lockfile
        run: npm audit fix --package-lock-only || true
      - name: Commit lockfile fixes when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add package-lock.json
          git commit -m "chore: apply safe dependency security fixes"
          git push origin HEAD:validate/phase-10-integrated-v1

name: CID occurrence chat isolated UI
on:
  pull_request:
    paths:
      - 'src/components/KyrubCidOccurrenceChat.tsx'
      - 'shared/cidSosRequest.ts'
      - 'tests/cid-occurrence-chat-ui.test.tsx'
      - '.github/workflows/cid-occurrence-chat-ui.yml'
permissions:
  contents: read
jobs:
  chat-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/cid-occurrence-chat-ui.test.tsx

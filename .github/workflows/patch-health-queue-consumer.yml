name: Patch health Queue consumer

on:
  push:
    branches:
      - feat/mercado-livre-order-ingress

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mercado-livre-order-ingress

      - name: Embed Mercado Livre Queue consumer in existing health function
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/health.ts')
          text = path.read_text()
          marker = "): Promise<void> {\n  const traceId = requestTraceId(request);"
          if "com.vercel.queue.v2beta" in text:
              print('Queue consumer already embedded.')
              raise SystemExit(0)
          replacement = '''): Promise<void> {
            const queueEventType = headerValue(
              request.headers['ce-type'] ?? request.headers['Ce-Type']
            );
            if (queueEventType === 'com.vercel.queue.v2beta') {
              const [{ QueueClient }, orderQueue] = await Promise.all([
                import('@vercel/queue'),
                import('../server/integrations/mercadoLivreOrderQueueService.js'),
              ]);
              const queue = new QueueClient();
              const callback = queue.handleNodeCallback(async (message, metadata) => {
                if (metadata.topicName !== orderQueue.MERCADO_LIVRE_ORDERS_V2_QUEUE_TOPIC) {
                  throw new Error('MERCADO_LIVRE_ORDER_QUEUE_TOPIC_MISMATCH');
                }
                const result = await orderQueue.consumeMercadoLivreOrderQueueMessage(message);
                console.info('[Mercado Livre orders_v2 consumed]', JSON.stringify({
                  topic: metadata.topicName,
                  messageId: metadata.messageId,
                  deliveryCount: metadata.deliveryCount,
                  disposition: result.disposition,
                  inboxId: result.inboxId,
                  outcome: result.outcome,
                }));
              });
              await (callback as unknown as (
                request: unknown,
                response: unknown
              ) => Promise<void>)(request, response);
              return;
            }

            const traceId = requestTraceId(request);'''
          if marker not in text:
              raise SystemExit('Expected health handler marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- api/health.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/health.ts
          git commit -m "Reuse health function for Mercado Livre Queue consumer"
          git push origin HEAD:feat/mercado-livre-order-ingress

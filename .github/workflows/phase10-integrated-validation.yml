name: Phase 10 integrated validation

on:
  pull_request:
    branches:
      - integration/roadmap-v1
      - main
      - feat/profile-react-rebuild
    paths:
      - 'src/**'
      - 'server/**'
      - 'shared/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase10-integrated-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-domain-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Phase 10 cross-domain contract
        run: node --test --import tsx tests/phase-10-cross-domain-contract.test.ts

  production-dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency graph for high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report complete dependency audit for triage
        if: always()
        run: npm audit --audit-level=moderate || true


  dependency-remediation-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Propose lockfile-only dependency remediation
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify proposed lockfile and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Upload proposed lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-secure-package-lock
          path: package-lock.json
          retention-days: 3

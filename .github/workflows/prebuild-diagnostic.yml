name: Prebuild Diagnostic

on:
  push:
    branches: ['fix/diag-merchant-approval-prebuild-v4']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuild-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Validate corrected full prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Align extracted implementation contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const replacements = [
            ['tests/app-routes.test.ts', 'src/components/modals/B2CCartDrawer.tsx', 'src/components/modals/B2CCartDrawerApprovalBase.tsx'],
            ['tests/storefront-experience-refinement.test.ts', 'src/components/modals/B2CCartDrawer.tsx', 'src/components/modals/B2CCartDrawerApprovalBase.tsx'],
            ['tests/in-person-payment-convergence.test.ts', 'src/components/modals/B2CCartDrawer.tsx', 'src/components/modals/B2CCartDrawerApprovalBase.tsx'],
            ['tests/local-service-pos.test.ts', 'server/inventory/orderStatusExecutionService.ts', 'server/inventory/orderStatusExecutionServiceBase.ts'],
            ['tests/economic-obligation-eligibility.test.ts', 'server/inventory/orderStatusExecutionService.ts', 'server/inventory/orderStatusExecutionServiceBase.ts'],
          ];

          for (const [path, oldValue, newValue] of replacements) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(oldValue)) throw new Error(`Expected stale contract not found in ${path}: ${oldValue}`);
            fs.writeFileSync(path, source.replace(oldValue, newValue));
          }
          NODE

      - name: Full prebuild validation
        run: |
          mkdir -p diagnostics
          set +e
          npm run prebuild > diagnostics/full-prebuild.txt 2>&1
          status=$?
          echo "prebuild_exit_code=$status" > diagnostics/full-prebuild-status.txt
          tail -n 80 diagnostics/full-prebuild.txt || true
          exit $status

      - name: Upload full prebuild diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-prebuild-diagnostic
          path: diagnostics/full-prebuild*.txt
          if-no-files-found: error
          retention-days: 3

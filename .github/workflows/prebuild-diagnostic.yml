name: Prebuild Diagnostic

on:
  push:
    branches: ['fix/diag-merchant-approval-prebuild-v4']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prebuild-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize corrected static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align extracted implementation contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const replacements = [
            ['tests/app-routes.test.ts', 'src/components/modals/B2CCartDrawer.tsx', 'src/components/modals/B2CCartDrawerApprovalBase.tsx'],
            ['tests/storefront-experience-refinement.test.ts', 'src/components/modals/B2CCartDrawer.tsx', 'src/components/modals/B2CCartDrawerApprovalBase.tsx'],
            ['tests/in-person-payment-convergence.test.ts', 'src/components/modals/B2CCartDrawer.tsx', 'src/components/modals/B2CCartDrawerApprovalBase.tsx'],
            ['tests/local-service-pos.test.ts', 'server/inventory/orderStatusExecutionService.ts', 'server/inventory/orderStatusExecutionServiceBase.ts'],
            ['tests/economic-obligation-eligibility.test.ts', 'server/inventory/orderStatusExecutionService.ts', 'server/inventory/orderStatusExecutionServiceBase.ts'],
          ];

          for (const [path, oldValue, newValue] of replacements) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(oldValue)) {
              fs.writeFileSync(path, source.replace(oldValue, newValue));
              continue;
            }
            if (!source.includes(newValue)) {
              throw new Error(`Neither stale nor corrected contract found in ${path}`);
            }
          }
          NODE

      - name: Commit corrected contract files on diagnostic branch
        run: |
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add \
            tests/app-routes.test.ts \
            tests/storefront-experience-refinement.test.ts \
            tests/in-person-payment-convergence.test.ts \
            tests/local-service-pos.test.ts \
            tests/economic-obligation-eligibility.test.ts
          if git diff --cached --quiet; then
            echo "Corrected contract blobs already materialized."
            exit 0
          fi
          git commit -m "Materialize corrected static contract blobs"
          git push origin HEAD:fix/diag-merchant-approval-prebuild-v4

name: Prebuild Diagnostic

on:
  push:
    branches: ['fix/diag-merchant-approval-prebuild-v4']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuild-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture exact prebuild failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Align drawer route contract with approval base
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'tests/app-routes.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const oldPath = "'src/components/modals/B2CCartDrawer.tsx'";
          const newPath = "'src/components/modals/B2CCartDrawerApprovalBase.tsx'";
          if (!source.includes(oldPath)) throw new Error('Expected stale drawer contract was not found');
          fs.writeFileSync(path, source.replace(oldPath, newPath));
          NODE

      - name: Capture prebuild test failures
        run: node scripts/report-prebuild-test-failures.mjs

      - name: Upload prebuild diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-test-failures
          path: diagnostics/prebuild-test-failures.*
          if-no-files-found: error
          retention-days: 3

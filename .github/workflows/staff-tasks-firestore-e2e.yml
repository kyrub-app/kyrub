name: Staff tasks Firestore E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/staff/staffTask*.ts'
      - 'server/staff/staffNoticeService.ts'
      - 'shared/staffTasks.ts'
      - 'src/components/store/StoreStaffTasks*.tsx'
      - 'api/health.ts'
      - 'vercel.json'
      - 'tests/staff-tasks*'
      - '.github/workflows/staff-tasks-firestore-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tasks-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Verify store isolation, assignee access, audit, notifications and idempotency
        env:
          FIREBASE_PROJECT_ID: kyrub-security-test
          GCLOUD_PROJECT: kyrub-security-test
          GOOGLE_CLOUD_PROJECT: kyrub-security-test
        run: npx --yes firebase-tools@15.35.0 emulators:exec --config firebase.security.json --project kyrub-security-test --only firestore "node --import tsx tests/staff-tasks-serverless-http-e2e.mjs"

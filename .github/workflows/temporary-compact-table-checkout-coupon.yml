name: Temporary compact table checkout coupon update

on:
  push:
    branches:
      - ux/compact-table-checkout-coupon

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compact checkout and coupon changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # Authenticated server coupon quote helper.
          path = Path('src/utils/localPixCheckout.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { auth } from './firebase';\n",
              "import { auth } from './firebase';\nimport type { StorePromotionQuote } from './storePromotions';\n",
              'local pix promotion type import',
          )
          marker = "export const loadPendingLocalPayment = async (input: {\n"
          helper = """export const quoteLocalCoupon = async (input: {\n  storeId: string;\n  couponCode: string;\n  items: Array<{ productId: string; quantity: number }>;\n}): Promise<StorePromotionQuote> => {\n  const couponCode = input.couponCode.trim();\n  if (!couponCode) throw new Error('Digite um cupom para aplicar.');\n  if (input.items.length === 0) {\n    throw new Error('Selecione ao menos um item antes de aplicar o cupom.');\n  }\n  return json<StorePromotionQuote>(\n    await authorizedFetch('/api/payments/coupons/quote', {\n      method: 'POST',\n      body: JSON.stringify({\n        storeId: input.storeId,\n        couponCode,\n        items: input.items,\n      }),\n    }),\n    'Não foi possível validar o cupom.'\n  );\n};\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('local pix coupon helper marker not unique')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          # Persist the coupon composition with the table payment instead of only changing the UI.
          path = Path('src/utils/legacyTableOperations.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { db } from './firebase';\n",
              "import { db } from './firebase';\nimport type { StorePromotionQuote } from './storePromotions';\n",
              'table operations promotion type import',
          )
          text = replace_once(
              text,
              "interface RegisterTablePaymentInput {\n  storeId: string;\n  tableCode: string;\n  selections: TableItemSelection[];\n  method: TablePaymentMethod;\n}\n",
              "interface RegisterTablePaymentInput {\n  storeId: string;\n  tableCode: string;\n  selections: TableItemSelection[];\n  method: TablePaymentMethod;\n  coupon?: StorePromotionQuote;\n}\n",
              'register payment coupon input',
          )
          text = replace_once(
              text,
              "const tableKey = (value: string): string =>\n  normalizeTableCode(value).toLocaleLowerCase('pt-BR');\n",
              "const tableKey = (value: string): string =>\n  normalizeTableCode(value).toLocaleLowerCase('pt-BR');\nconst roundMoney = (value: number): number => Math.round(value * 100) / 100;\n",
              'table payment money helper',
          )
          old_apply = """    const applied = applyTablePaymentSelections(\n      orders as CustomerOrder[],\n      input.tableCode,\n      input.selections\n    );\n    result = applied;\n\n    applied.updatedOrders.forEach(order => {\n"""
          new_apply = """    const applied = applyTablePaymentSelections(\n      orders as CustomerOrder[],\n      input.tableCode,\n      input.selections\n    );\n    const selectedSubtotal = roundMoney(applied.amount);\n    const coupon = input.coupon;\n    let paymentAmount = selectedSubtotal;\n    let discountAmount = 0;\n\n    if (coupon) {\n      const quotedSubtotal = roundMoney(coupon.subtotal);\n      const quotedDiscount = roundMoney(coupon.discountTotal);\n      const quotedTotal = roundMoney(coupon.total);\n      if (\n        !coupon.code.trim() ||\n        !Number.isFinite(quotedSubtotal) ||\n        !Number.isFinite(quotedDiscount) ||\n        !Number.isFinite(quotedTotal) ||\n        quotedDiscount < 0 ||\n        quotedTotal < 0 ||\n        Math.abs(quotedSubtotal - selectedSubtotal) > 0.009 ||\n        Math.abs(roundMoney(quotedSubtotal - quotedDiscount) - quotedTotal) > 0.009\n      ) {\n        throw new Error('O saldo selecionado mudou. Aplique o cupom novamente.');\n      }\n      discountAmount = quotedDiscount;\n      paymentAmount = quotedTotal;\n    }\n    result = { ...applied, amount: paymentAmount };\n\n    applied.updatedOrders.forEach(order => {\n"""
          text = replace_once(text, old_apply, new_apply, 'table payment coupon validation')
          text = replace_once(
              text,
              "      method: input.method,\n      amount: applied.amount,\n      quantity: applied.quantity,",
              "      method: input.method,\n      amount: paymentAmount,\n      originalAmount: selectedSubtotal,\n      discountAmount,\n      couponCode: coupon?.code ?? '',\n      couponTitle: coupon?.title ?? '',\n      promotionId: coupon?.promotionId ?? '',\n      quantity: applied.quantity,",
              'table payment coupon persistence',
          )
          path.write_text(text)

          # Compact account: quote/apply coupon below the payable balance and before payment methods.
          path = Path('src/components/customer/LegacyTableServiceWorkspace.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "  Send,\n  Trash2,\n  Utensils,",
              "  Send,\n  TicketPercent,\n  Trash2,\n  Utensils,",
              'coupon icon import',
          )
          text = replace_once(
              text,
              "} from '../../utils/tableOperations';\nimport { SharedPdvCatalog } from '../pdv/SharedPdvCatalog';",
              "} from '../../utils/tableOperations';\nimport { quoteLocalCoupon } from '../../utils/localPixCheckout';\nimport type { StorePromotionQuote } from '../../utils/storePromotions';\nimport { SharedPdvCatalog } from '../pdv/SharedPdvCatalog';",
              'coupon helper import',
          )
          text = replace_once(
              text,
              "  notify: (message: string, type?: 'success' | 'error' | 'info') => void;\n}",
              "  notify: (message: string, type?: 'success' | 'error' | 'info') => void;\n  onAppliedCouponChange?: (couponCode: string) => void;\n}",
              'coupon callback prop',
          )
          text = replace_once(
              text,
              "type BusyAction = '' | 'order' | 'payment' | 'transfer' | 'exclude';",
              "type BusyAction = '' | 'order' | 'payment' | 'transfer' | 'exclude' | 'coupon';",
              'coupon busy action',
          )
          text = replace_once(
              text,
              "  onClose,\n  notify,\n}: TableServiceWorkspaceProps) => {",
              "  onClose,\n  notify,\n  onAppliedCouponChange,\n}: TableServiceWorkspaceProps) => {",
              'coupon callback destructure',
          )
          text = replace_once(
              text,
              "  const [excludingLineKey, setExcludingLineKey] = useState('');\n",
              "  const [excludingLineKey, setExcludingLineKey] = useState('');\n  const [couponCode, setCouponCode] = useState('');\n  const [couponQuote, setCouponQuote] = useState<StorePromotionQuote | null>(null);\n",
              'coupon state',
          )
          text = replace_once(
              text,
              "    setTargetTableCode('');\n    setExcludingLineKey('');\n  }, [tableCode]);\n",
              "    setTargetTableCode('');\n    setExcludingLineKey('');\n    setCouponCode('');\n    setCouponQuote(null);\n    onAppliedCouponChange?.('');\n  }, [tableCode, onAppliedCouponChange]);\n\n  useEffect(() => {\n    setCouponQuote(null);\n    onAppliedCouponChange?.('');\n  }, [paymentSelections, onAppliedCouponChange]);\n",
              'coupon reset effects',
          )
          selected_total = """  const selectedPaymentTotal = openLines.reduce(\n    (sum, line) => sum + (paymentSelections[line.key] ?? 0) * line.price,\n    0\n  );\n"""
          selected_total_new = selected_total + """  const selectedCouponItems = useMemo(() => {\n    const quantities = new Map<string, number>();\n    for (const line of openLines) {\n      const quantity = paymentSelections[line.key] ?? 0;\n      if (quantity <= 0 || !line.productId.trim()) continue;\n      quantities.set(line.productId, (quantities.get(line.productId) ?? 0) + quantity);\n    }\n    return Array.from(quantities, ([productId, quantity]) => ({ productId, quantity }));\n  }, [openLines, paymentSelections]);\n  const payablePaymentTotal = couponQuote?.total ?? selectedPaymentTotal;\n"""
          text = replace_once(text, selected_total, selected_total_new, 'coupon selected items')

          payment_marker = "  const handleRegisterPayment = async (): Promise<void> => {\n"
          coupon_handler = """  const assertCouponMatchesSelection = (quote: StorePromotionQuote): void => {\n    if (Math.abs(quote.subtotal - selectedPaymentTotal) > 0.009) {\n      throw new Error('O valor dos itens mudou. Revise a seleção e aplique o cupom novamente.');\n    }\n  };\n\n  const handleApplyCoupon = async (): Promise<void> => {\n    const code = couponCode.trim();\n    if (!code) {\n      notify('Digite o código do cupom.', 'info');\n      return;\n    }\n    if (paymentSelectionArray.length === 0) {\n      notify('Selecione ao menos um item antes de aplicar o cupom.', 'info');\n      return;\n    }\n\n    setBusyAction('coupon');\n    try {\n      const quote = await quoteLocalCoupon({\n        storeId,\n        couponCode: code,\n        items: selectedCouponItems,\n      });\n      assertCouponMatchesSelection(quote);\n      setCouponCode(quote.code);\n      setCouponQuote(quote);\n      onAppliedCouponChange?.(quote.code);\n      notify(\n        `Cupom ${quote.code} aplicado. Saldo a pagar: ${formatCurrency(quote.total)}.`,\n        'success'\n      );\n    } catch (error) {\n      setCouponQuote(null);\n      onAppliedCouponChange?.('');\n      notify(\n        error instanceof Error ? error.message : 'Não foi possível aplicar o cupom.',\n        'error'\n      );\n    } finally {\n      setBusyAction('');\n    }\n  };\n\n"""
          if text.count(payment_marker) != 1:
              raise SystemExit('register payment handler marker not unique')
          text = text.replace(payment_marker, coupon_handler + payment_marker, 1)

          old_register = """    setBusyAction('payment');\n    try {\n      const result = await registerTablePayment(user, {\n        storeId,\n        tableCode,\n        selections: paymentSelectionArray,\n        method: paymentMethod,\n      });\n      setPaymentSelections({});\n      notify(\n        `${formatCurrency(result.amount)} registrado em ${getTablePaymentMethodLabel(paymentMethod)}.`,\n        'success'\n      );\n"""
          new_register = """    setBusyAction('payment');\n    try {\n      let confirmedCoupon = couponQuote;\n      if (couponQuote) {\n        confirmedCoupon = await quoteLocalCoupon({\n          storeId,\n          couponCode: couponQuote.code,\n          items: selectedCouponItems,\n        });\n        assertCouponMatchesSelection(confirmedCoupon);\n        setCouponQuote(confirmedCoupon);\n        onAppliedCouponChange?.(confirmedCoupon.code);\n      }\n      const result = await registerTablePayment(user, {\n        storeId,\n        tableCode,\n        selections: paymentSelectionArray,\n        method: paymentMethod,\n        ...(confirmedCoupon ? { coupon: confirmedCoupon } : {}),\n      });\n      setPaymentSelections({});\n      setCouponCode('');\n      setCouponQuote(null);\n      onAppliedCouponChange?.('');\n      notify(\n        `${formatCurrency(result.amount)} registrado em ${getTablePaymentMethodLabel(paymentMethod)}.`,\n        'success'\n      );\n"""
          text = replace_once(text, old_register, new_register, 'register discounted payment')

          old_summary = """                  <div className=\"space-y-2 rounded-2xl bg-slate-900 p-3 text-xs\">\n                    <div className=\"flex justify-between text-slate-500\">\n                      <span>Pedidos ativos</span>\n                      <span>{activeOrders.length}</span>\n                    </div>\n                    <div className=\"flex justify-between text-slate-500\">\n                      <span>Saldo da mesa</span>\n                      <span>{formatCurrency(outstandingTotal)}</span>\n                    </div>\n                    <div className=\"flex justify-between border-t border-slate-800 pt-2 font-black text-white\">\n                      <span>Selecionado</span>\n                      <span>{formatCurrency(selectedPaymentTotal)}</span>\n                    </div>\n                  </div>\n                  <div className=\"grid grid-cols-2 gap-2\">\n"""
          new_summary = """                  <div className=\"space-y-2 rounded-2xl bg-slate-900 p-3 text-xs\">\n                    <div className=\"flex justify-between text-slate-500\">\n                      <span>Pedidos ativos</span>\n                      <span>{activeOrders.length}</span>\n                    </div>\n                    <div className=\"flex justify-between text-slate-500\">\n                      <span>Saldo da mesa</span>\n                      <span>{formatCurrency(outstandingTotal)}</span>\n                    </div>\n                    {couponQuote && (\n                      <>\n                        <div className=\"flex justify-between text-slate-500\">\n                          <span>Selecionado</span>\n                          <span>{formatCurrency(selectedPaymentTotal)}</span>\n                        </div>\n                        <div className=\"flex justify-between font-bold text-violet-300\">\n                          <span>Desconto · {couponQuote.code}</span>\n                          <span>− {formatCurrency(couponQuote.discountTotal)}</span>\n                        </div>\n                      </>\n                    )}\n                    <div className=\"flex justify-between border-t border-slate-800 pt-2 font-black text-white\">\n                      <span>Saldo a pagar</span>\n                      <span>{formatCurrency(payablePaymentTotal)}</span>\n                    </div>\n                  </div>\n\n                  <div className=\"rounded-2xl border border-violet-500/20 bg-violet-500/[0.05] p-3\">\n                    <label htmlFor=\"staff-table-coupon-code\" className=\"flex items-center gap-2 text-[10px] font-black text-violet-100\">\n                      <TicketPercent className=\"h-4 w-4\" />\n                      Cupom de desconto\n                    </label>\n                    <div className=\"mt-2 flex gap-2\">\n                      <input\n                        id=\"staff-table-coupon-code\"\n                        type=\"text\"\n                        value={couponCode}\n                        maxLength={48}\n                        autoComplete=\"off\"\n                        spellCheck={false}\n                        onChange={event => {\n                          setCouponCode(event.target.value.toUpperCase());\n                          setCouponQuote(null);\n                          onAppliedCouponChange?.('');\n                        }}\n                        placeholder=\"Digite o cupom\"\n                        className=\"min-h-10 min-w-0 flex-1 rounded-xl border border-slate-800 bg-slate-900 px-3 text-xs font-bold uppercase text-white outline-none placeholder:normal-case placeholder:text-slate-600 focus:border-violet-400\"\n                      />\n                      <button\n                        type=\"button\"\n                        onClick={() => void handleApplyCoupon()}\n                        disabled={\n                          !couponCode.trim() ||\n                          paymentSelectionArray.length === 0 ||\n                          busyAction === 'coupon' ||\n                          busyAction === 'payment'\n                        }\n                        className=\"min-h-10 rounded-xl bg-violet-500 px-3 text-[9px] font-black uppercase text-white disabled:opacity-40\"\n                      >\n                        {busyAction === 'coupon' ? 'Aplicando...' : 'Aplicar'}\n                      </button>\n                    </div>\n                    {couponQuote && (\n                      <p className=\"mt-2 text-[9px] font-semibold text-violet-200\">\n                        {couponQuote.title} · desconto de {formatCurrency(couponQuote.discountTotal)} aplicado.\n                      </p>\n                    )}\n                  </div>\n\n                  <div className=\"grid grid-cols-2 gap-2\">\n"""
          text = replace_once(text, old_summary, new_summary, 'compact coupon layout')
          path.write_text(text)

          # Remove the verbose injected account block while preserving the canonical Pix modal.
          path = Path('src/components/customer/TableServiceWorkspace.tsx')
          text = path.read_text()
          text = replace_once(text, "import { createPortal } from 'react-dom';\n", "", 'remove account portal import')
          text = replace_once(
              text,
              "type TableServiceWorkspaceProps = React.ComponentProps<typeof LegacyTableServiceWorkspace>;",
              "type TableServiceWorkspaceProps = Omit<\n  React.ComponentProps<typeof LegacyTableServiceWorkspace>,\n  'onAppliedCouponChange'\n>;",
              'wrapper hidden coupon callback prop',
          )
          text = replace_once(
              text,
              "  const [pixCheckoutOpen, setPixCheckoutOpen] = useState(false);\n  const [accountCheckoutHost, setAccountCheckoutHost] = useState<HTMLElement | null>(null);\n",
              "  const [pixCheckoutOpen, setPixCheckoutOpen] = useState(false);\n  const [appliedCouponCode, setAppliedCouponCode] = useState('');\n",
              'wrapper coupon state',
          )
          text = replace_once(
              text,
              "  useEffect(() => {\n    setPixCheckoutOpen(false);\n  }, [props.storeId, props.tableCode]);\n",
              "  useEffect(() => {\n    setPixCheckoutOpen(false);\n    setAppliedCouponCode('');\n  }, [props.storeId, props.tableCode]);\n",
              'wrapper coupon reset',
          )
          effect_start = """  useEffect(() => {\n    let disposed = false;\n    let host: HTMLDivElement | null = null;\n\n    const install = (): void => {\n"""
          effect_end = """  }, [props.storeId, props.tableCode]);\n\n  const interceptLegacyPix"""
          start = text.find(effect_start)
          end = text.find(effect_end, start)
          if start < 0 or end < 0:
              raise SystemExit('account portal effect boundaries not found')
          end += len("  }, [props.storeId, props.tableCode]);\n\n")
          text = text[:start] + text[end:]
          text = replace_once(
              text,
              "      storeId={props.storeId}\n      orders={activeOrders}\n    />",
              "      storeId={props.storeId}\n      orders={activeOrders}\n      couponCode={appliedCouponCode}\n    />",
              'pix panel applied coupon prop',
          )
          text = replace_once(
              text,
              "        <LegacyTableServiceWorkspace {...props} />",
              "        <LegacyTableServiceWorkspace\n          {...props}\n          onAppliedCouponChange={setAppliedCouponCode}\n        />",
              'wrapper coupon callback wiring',
          )
          portal_start = """\n      {accountCheckoutHost && createPortal(\n"""
          portal_end = """\n\n      {pixCheckoutOpen && (\n"""
          start = text.find(portal_start)
          end = text.find(portal_end, start)
          if start < 0 or end < 0:
              raise SystemExit('account portal jsx boundaries not found')
          text = text[:start] + portal_end + text[end + len(portal_end):]
          path.write_text(text)

          # Pix uses the coupon already applied in the compact account; no duplicate coupon field.
          path = Path('src/components/store/ServiceLocationFinancialContextPanel.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "export function ServiceLocationFinancialContextPanel({\n  storeId,\n  orders,\n}: {\n  storeId: string;\n  orders: CustomerOrder[];\n}) {",
              "export function ServiceLocationFinancialContextPanel({\n  storeId,\n  orders,\n  couponCode: appliedCouponCode = '',\n}: {\n  storeId: string;\n  orders: CustomerOrder[];\n  couponCode?: string;\n}) {",
              'pix panel coupon prop',
          )
          text = replace_once(
              text,
              "    const couponCode = (pixByOrder[order.id]?.couponCode ?? '').trim();",
              "    const couponCode = appliedCouponCode.trim();",
              'pix uses account coupon',
          )
          text = replace_once(
              text,
              "        confirmedCredit: false,\n      });\n      await refresh(true);",
              "        confirmedCredit: false,\n        couponCode,\n      });\n      await refresh(true);",
              'freeze applied coupon on pix checkout',
          )
          text = replace_once(
              text,
              "  }, [patchPix, pixByOrder, refresh, storeId]);",
              "  }, [appliedCouponCode, patchPix, pixByOrder, refresh, storeId]);",
              'pix coupon dependency',
          )
          text = text.replace(
              "          const hasPendingPayment = (context?.canonicalProjection.pendingPaymentCount ?? 0) > 0;\n",
              "",
              1,
          )
          coupon_ui_start = """                  <div className=\"mb-3 rounded-lg border border-violet-400/15 bg-violet-500/[0.05] p-2.5\">\n                    <label htmlFor={`coupon-${order.id}`}"""
          start = text.find(coupon_ui_start)
          if start < 0:
              raise SystemExit('pix duplicate coupon UI start not found')
          buttons_marker = """                  <div className=\"flex flex-wrap gap-2\">\n"""
          end = text.find(buttons_marker, start)
          if end < 0:
              raise SystemExit('pix provider buttons marker not found')
          text = text[:start] + text[end:]
          path.write_text(text)

          # Focused regression coverage for the requested layout and money flow.
          Path('tests/table-checkout-coupon.test.ts').write_text(r'''import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import test from 'node:test';

const wrapper = readFileSync('src/components/customer/TableServiceWorkspace.tsx', 'utf8');
const workspace = readFileSync('src/components/customer/LegacyTableServiceWorkspace.tsx', 'utf8');
const tableOperations = readFileSync('src/utils/legacyTableOperations.ts', 'utf8');
const pixClient = readFileSync('src/utils/localPixCheckout.ts', 'utf8');
const financialPanel = readFileSync('src/components/store/ServiceLocationFinancialContextPanel.tsx', 'utf8');

test('staff account removes the verbose canonical block but preserves canonical Pix', () => {
  assert.doesNotMatch(wrapper, /staff-table-canonical-coupon-checkout-host/);
  assert.doesNotMatch(wrapper, /Checkout canônico · Mesa/);
  assert.doesNotMatch(wrapper, /Cupom, valor final e cobrança Pix/);
  assert.match(wrapper, /staff-table-canonical-pix-checkout/);
  assert.match(wrapper, /ServiceLocationFinancialContextPanel/);
});

test('coupon sits below payable balance and before payment method buttons', () => {
  const balance = workspace.indexOf('Saldo a pagar');
  const coupon = workspace.indexOf('Cupom de desconto');
  const paymentMethods = workspace.indexOf("(['cash', 'pix', 'card', 'other']");
  assert.ok(balance >= 0);
  assert.ok(coupon > balance);
  assert.ok(paymentMethods > coupon);
  assert.match(workspace, /staff-table-coupon-code/);
  assert.match(workspace, /Aplicar/);
  assert.match(workspace, /payablePaymentTotal/);
  assert.match(workspace, /couponQuote\.discountTotal/);
});

test('coupon quote is authenticated server authority and updates the recorded payment amount', () => {
  assert.match(pixClient, /\/api\/payments\/coupons\/quote/);
  assert.match(pixClient, /authorizedFetch/);
  assert.match(workspace, /quoteLocalCoupon/);
  assert.match(workspace, /assertCouponMatchesSelection/);
  assert.match(workspace, /coupon: confirmedCoupon/);
  assert.match(tableOperations, /originalAmount: selectedSubtotal/);
  assert.match(tableOperations, /discountAmount/);
  assert.match(tableOperations, /couponCode: coupon\?\.code/);
  assert.match(tableOperations, /amount: paymentAmount/);
});

test('Pix reuses the already-applied coupon instead of rendering a second coupon input', () => {
  assert.match(wrapper, /couponCode=\{appliedCouponCode\}/);
  assert.match(financialPanel, /couponCode: appliedCouponCode = ''/);
  assert.match(financialPanel, /const couponCode = appliedCouponCode\.trim\(\)/);
  assert.doesNotMatch(financialPanel, /id=\{`coupon-\$\{order\.id\}`\}/);
  assert.match(financialPanel, /couponCode,/);
});
''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Focused regression tests
        run: node --test --import tsx tests/table-checkout-coupon.test.ts tests/table-operations.test.ts tests/local-pix-checkout-ui.test.ts tests/storefront-experience-refinement.test.ts
      - name: Full application build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/temporary-compact-table-checkout-coupon.yml
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add -A
          git commit -m "Compact table checkout and apply coupon before payment"
          git push origin HEAD:ux/compact-table-checkout-coupon

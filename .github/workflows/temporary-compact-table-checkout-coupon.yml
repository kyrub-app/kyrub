name: Temporary compact table checkout coupon update

on:
  push:
    branches:
      - ux/compact-table-checkout-coupon

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compact checkout and coupon changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/compact-table-checkout-source.txt').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install dependencies"
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          old = '''text = replace_once(
              text,
              "  }, [patchPix, pixByOrder, refresh, storeId]);",
              "  }, [appliedCouponCode, patchPix, pixByOrder, refresh, storeId]);",
              'pix coupon dependency',
          )'''
          new = '''text = text.replace(
              "  }, [patchPix, pixByOrder, refresh, storeId]);",
              "  }, [appliedCouponCode, patchPix, pixByOrder, refresh, storeId]);",
              1,
          )'''
          if old not in body:
              raise SystemExit('pix coupon dependency patch source not found')
          body = body.replace(old, new, 1)
          exec(compile(body, 'compact-table-checkout-source', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Focused regression tests
        run: node --test --import tsx tests/table-checkout-coupon.test.ts tests/table-operations.test.ts tests/local-pix-checkout-ui.test.ts tests/storefront-experience-refinement.test.ts
      - name: Full application build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/temporary-compact-table-checkout-coupon.yml
          rm .github/scripts/compact-table-checkout-source.txt
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add -A
          git commit -m "Compact table checkout and apply coupon before payment"
          git push origin HEAD:ux/compact-table-checkout-coupon

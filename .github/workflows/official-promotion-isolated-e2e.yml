name: Official promotion isolated Firestore E2E

on:
  pull_request:
    paths:
      - 'server/payments/officialPlanPromotion*.ts'
      - 'tests/firestore-official-plan-promotion-isolated.test.ts'
      - 'tests/helpers/officialPromotionEmulatorFixture.ts'
      - '.github/workflows/official-promotion-isolated-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-promotion-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KYRUB_OFFICIAL_PROMOTION_ISOLATED_PIX_TEST: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Compose Firestore rules
        run: npm run firestore:compose

      - name: Run isolated ERP coupon Firestore transaction test
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools emulators:exec --config firebase.security.json --project demo-kyrub-official-promotion --only firestore "node --test --test-concurrency=1 --import tsx tests/firestore-official-plan-promotion-isolated.test.ts" 2>&1 | tee official-promotion-emulator.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: official-promotion-emulator-failure-log
          path: official-promotion-emulator.log
          if-no-files-found: ignore

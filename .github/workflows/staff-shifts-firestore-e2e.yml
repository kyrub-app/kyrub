name: Staff shifts Firestore E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/staff/staffShift*.ts'
      - 'server/staff/staffTaskService.ts'
      - 'server/staff/staffNoticeService.ts'
      - 'shared/staffShifts.ts'
      - 'src/components/store/StoreStaffShift*.tsx'
      - 'api/health.ts'
      - 'vercel.json'
      - 'tests/staff-shifts*'
      - '.github/workflows/staff-shifts-firestore-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shifts-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run firestore:compose
      - name: Verify staff schedules, overlap locks, night shifts, day off and cancellation
        env:
          FIREBASE_PROJECT_ID: kyrub-security-test
          GCLOUD_PROJECT: kyrub-security-test
          GOOGLE_CLOUD_PROJECT: kyrub-security-test
        run: npx --yes firebase-tools@15.35.0 emulators:exec --config firebase.security.json --project kyrub-security-test --only firestore "node --import tsx tests/staff-shifts-serverless-http-e2e.mjs"

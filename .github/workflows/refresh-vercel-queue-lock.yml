name: Refresh Vercel Queue lock

on:
  push:
    branches:
      - feat/mercado-livre-order-ingress

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mercado-livre-order-ingress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel Queue SDK deterministically
        run: npm install @vercel/queue@0.5.1 --save-exact

      - name: Commit dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Vercel Queue SDK"
          git push origin HEAD:feat/mercado-livre-order-ingress

name: CID SOS isolated policy
on:
  pull_request:
    paths:
      - 'server/identity/cidSosAlertPolicy.ts'
      - 'shared/cidSosRequest.ts'
      - 'tests/cid-sos-alert-policy.test.ts'
      - '.github/workflows/cid-sos-policy.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/cid-sos-alert-policy.test.ts

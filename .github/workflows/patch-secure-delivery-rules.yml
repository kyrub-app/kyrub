name: Patch secure delivery rules

on:
  push:
    branches:
      - agent/secure-kyrub-deliveries
    paths:
      - .github/workflows/patch-secure-delivery-rules.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-kyrub-deliveries
      - name: Restrict Kyrub Entregas writes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          source = path.read_text()
          old = """    // --- Guia Renda: Entregas Solicitadas/Disponíveis ---
    match /hub/renda/deliveries/{deliveryId} {
      allow read: if isSignedIn();
      allow create: if isSignedIn(); // Qualquer usuário ou lojista logado pode solicitar
      allow update, delete: if isSignedIn();
    }
"""
          new = """    // --- Guia Renda: Entregas Solicitadas/Disponíveis ---
    // O documento é uma projeção pública autenticada. Publicação, aceite,
    // coleta e conclusão são operações server-authoritative executadas pelo
    // Firebase Admin SDK, que não é limitado por estas regras de cliente.
    match /hub/renda/deliveries/{deliveryId} {
      allow read: if isSignedIn();
      allow create, update, delete: if false;
    }
"""
          if old not in source:
              raise SystemExit('Delivery rules block not found')
          path.write_text(source.replace(old, new))
          PY
      - name: Commit rule patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firestore.rules
          git commit -m "Restrict Kyrub delivery mural writes"
          git push

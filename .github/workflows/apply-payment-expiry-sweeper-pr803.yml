name: Apply deterministic marketplace Pix expiry sweep

on:
  push:
    branches:
      - fix/merchant-approval-before-payment
    paths:
      - .github/workflows/apply-payment-expiry-sweeper-pr803.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merchant-approval-before-payment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire expiry sweeper into existing serverless multiplexer
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          reservation = Path('server/inventory/marketplaceOrderInventoryReservationService.ts')
          text = reservation.read_text()
          broken = """    const remaining = roundQuantity(\n      Math.max(0, (next[line.inventoryItemId] ?? 0) - line.quantity\n    );"""
          fixed = """    const remaining = roundQuantity(\n      Math.max(0, (next[line.inventoryItemId] ?? 0) - line.quantity)\n    );"""
          if text.count(broken) != 1:
              raise SystemExit(f'reservation syntax marker mismatch: {text.count(broken)}')
          reservation.write_text(text.replace(broken, fixed, 1))

          action = Path('api/action-execute.ts')
          text = action.read_text()
          old = """  if ((request.method ?? 'GET').toUpperCase() !== 'POST') {\n    response.status(405).json({\n      error: 'Método não permitido.',\n      code: 'METHOD_NOT_ALLOWED',\n    });\n    return;\n  }\n\n  const authorization = headerValue(\n    request.headers.authorization ?? request.headers.Authorization\n  );\n  const transport = headerValue(request.query?.transport);\n\n"""
          new = """  const method = (request.method ?? 'GET').toUpperCase();\n  const authorization = headerValue(\n    request.headers.authorization ?? request.headers.Authorization\n  );\n  const transport = headerValue(request.query?.transport);\n\n  if (transport === 'marketplace-payment-expiry') {\n    if (method !== 'GET') {\n      response.status(405).json({\n        error: 'Método não permitido.',\n        code: 'METHOD_NOT_ALLOWED',\n      });\n      return;\n    }\n    const cronSecret = clean(process.env.CRON_SECRET);\n    if (!cronSecret || bearerToken(authorization) !== cronSecret) {\n      response.status(401).json({\n        error: 'Cron não autorizado.',\n        code: 'CRON_UNAUTHORIZED',\n      });\n      return;\n    }\n    try {\n      const expiry = await import('../server/payments/marketplacePaymentExpiryService.js');\n      response.status(200).json(await expiry.expireDueMarketplacePixReservations());\n    } catch (error) {\n      console.error('[Marketplace Payment Expiry]', error);\n      response.status(503).json({\n        error: 'Não foi possível reconciliar os Pix expirados agora.',\n        code: 'PAYMENT_EXPIRY_SWEEP_UNAVAILABLE',\n      });\n    }\n    return;\n  }\n\n  if (method !== 'POST') {\n    response.status(405).json({\n      error: 'Método não permitido.',\n      code: 'METHOD_NOT_ALLOWED',\n    });\n    return;\n  }\n\n"""
          if text.count(old) != 1:
              raise SystemExit(f'action execute marker mismatch: {text.count(old)}')
          action.write_text(text.replace(old, new, 1))

          vercel = Path('vercel.json')
          config = json.loads(vercel.read_text())
          cron = {
            'path': '/api/payments/maintenance/expire',
            'schedule': '*/5 * * * *',
          }
          crons = [entry for entry in config.get('crons', []) if entry.get('path') != cron['path']]
          crons.append(cron)
          config['crons'] = crons
          rewrite = {
            'source': '/api/payments/maintenance/expire',
            'destination': '/api/action-execute?transport=marketplace-payment-expiry',
          }
          rewrites = [entry for entry in config.get('rewrites', []) if entry.get('source') != rewrite['source']]
          payment_index = next(
            (index for index, entry in enumerate(rewrites) if entry.get('source') == '/api/payments/intents'),
            len(rewrites),
          )
          rewrites.insert(payment_index, rewrite)
          config['rewrites'] = rewrites
          vercel.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run lint
      - name: Validate focused approval contract
        run: node --test --import tsx tests/order-approval-routing.test.ts
      - name: Validate serverless graph
        run: |
          npm run prebuild
          npm run build --ignore-scripts
          node scripts/normalize-serverless-esm-imports.mjs
          npm run validate:serverless
      - name: Commit product changes and remove temporary workflow
        run: |
          rm .github/workflows/apply-payment-expiry-sweeper-pr803.yml
          git config user.name "kyrub-app"
          git config user.email "kyrub.app@gmail.com"
          git add api/action-execute.ts vercel.json server/inventory/marketplaceOrderInventoryReservationService.ts .github/workflows/apply-payment-expiry-sweeper-pr803.yml
          git commit -m "Schedule deterministic marketplace Pix expiry"
          git push origin HEAD:fix/merchant-approval-before-payment

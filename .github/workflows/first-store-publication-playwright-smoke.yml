name: First store publication Playwright smoke
on:
  pull_request:
    paths:
      - 'server.ts'
      - 'tests/first-store-publication-playwright-smoke.mjs'
      - '.github/workflows/first-store-publication-playwright-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      PORT: '3000'
      FIREBASE_PROJECT_ID: kyrub-security-test
      GCLOUD_PROJECT: kyrub-security-test
      GOOGLE_CLOUD_PROJECT: kyrub-security-test
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088
      KYRUB_FIRST_STORE_PUBLICATION_E2E_LOCAL: 'true'
      VITE_KYRUB_FIREBASE_EMULATOR_E2E: 'true'
      VITE_KYRUB_FIRST_STORE_PUBLICATION_SERVER_ENABLED: 'true'
      KYRUB_FIRST_STORE_PUBLICATION_SERVER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install isolated Chromium runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Compose Firestore security rules
        run: npm run firestore:compose
      - name: Run browser smoke against emulator-only local app
        run: |
          npx --yes firebase-tools emulators:exec --config firebase.security.json --project kyrub-security-test --only auth,firestore 'bash -euo pipefail -c '\''npm run dev > /tmp/kyrub-e2e-server.log 2>&1 & server_pid=$!; trap "kill $server_pid 2>/dev/null || true" EXIT; for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi; sleep 2; done; curl -fsS http://127.0.0.1:3000/api/health; node tests/first-store-publication-playwright-smoke.mjs'\'''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyrub-isolated-chromium-smoke
          path: |
            playwright-kyrub-isolated-smoke.png
          if-no-files-found: ignore
          retention-days: 3
